body{background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#6af;}
canvas{display:block;}

<script>
// ── WAKE LOCK (prevent screen dimming) ────────────────
let wakeLock = null;
async function acquireWakeLock(){
  try {
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{
        // Re-acquire if released (e.g. tab was hidden)
        setTimeout(acquireWakeLock, 1000);
      });
    }
  } catch(e){ console.log('Wake lock not available:', e.message); }
}
// Re-acquire when tab becomes visible again
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible') acquireWakeLock();
});

// ── LANDSCAPE GUARD ──────────────────────────────────
function checkLandscape(){
  const land=window.innerWidth>window.innerHeight;
  document.getElementById('landscape-prompt').style.display=land?'none':'flex';
}
window.addEventListener('resize',checkLandscape);
window.addEventListener('orientationchange',()=>setTimeout(checkLandscape,200));
checkLandscape();
const CCX=8300,CCY=8300;
const CMIN=100,CMAX=16500;          // C-chip bounds
const QMIN=2550,QMAX=14050;         // Q-chip bounds
const GAP=80;                        // um between Nb surfaces
const NBT=0.5;                       // Nb thickness
const BRAD=15;                       // bump cylinder radius
const BFOOT=20;                      // bump foot disk radius
const BFOOT_H=1.0;                   // foot disk height
const SEGS=20;
const START={x:CCX, y:QMIN-1500, z:GAP*0.5};
const START_YAW=180;


// ── SQUID SITES (layer 3 — magnetic field sources) ────
const SQUID_SITES=[[8300.0,4664.0,15.0],[8300.0,11936.0,15.0],[8300.0,6964.0,15.0],[8300.0,9636.0,15.0],[12742.0,8445.0,20.0],[10650.0,9364.0,15.0],[9500.0,9664.0,15.0],[11800.0,9664.0,15.0],[9653.0,10655.0,33.0],[11953.0,10655.0,33.0],[10725.0,12667.0,15.0],[10650.0,11936.0,15.0],[9500.0,11964.0,15.0],[11800.0,11964.0,15.0],[9500.0,13464.0,15.0],[11953.0,8306.0,33.0],[9347.0,8294.0,33.0],[4800.0,9336.0,15.0],[4647.0,10645.0,33.0],[3300.0,9345.0,15.0],[5950.0,9364.0,15.0],[6947.0,10645.0,33.0],[3920.0,10715.0,17.0],[7100.0,9664.0,15.0],[5950.0,11936.0,15.0],[4800.0,11964.0,15.0],[7100.0,11964.0,15.0],[8228.0,12668.0,15.0],[6947.0,8294.0,33.0],[4800.0,6936.0,15.0],[4755.0,8278.0,36.0],[5950.0,7236.0,15.0],[7100.0,7264.0,15.0],[3918.0,8238.0,18.0],[5875.0,3933.0,15.0],[5950.0,4664.0,15.0],[7100.0,3136.0,15.0],[4800.0,4636.0,15.0],[7100.0,4636.0,15.0],[4647.0,5945.0,33.0],[6947.0,5945.0,33.0],[8372.0,3932.0,15.0],[9500.0,4636.0,15.0],[11800.0,4636.0,15.0],[10650.0,4664.0,15.0],[12680.0,5885.0,17.0],[9653.0,5955.0,33.0],[11953.0,5955.0,33.0],[9500.0,6936.0,15.0],[11800.0,6936.0,15.0],[13300.0,6936.0,15.0],[10650.0,7236.0,15.0]];
// Each site: [cx, cy, radius]

// ── MAGNETIC FLUX LINES ───────────────────────────────
const FLUX_N       = 50;      // lines per SQUID
const FLUX_SIGMA   = 18;      // gaussian spread um
const FLUX_CUTOFF  = 32;      // hard cutoff um
const FLUX_VIS     = 1000;    // visibility distance um
const FLUX_SPEED   = 0.04;    // arrow travel speed um/ms
let   fluxPhase    = 0;
const fluxLines    = [];      // {cx,cy,ox,oy}
let   fireCanvas   = null;
let   fireCtx      = null;

function initFire(){
  fluxLines.length=0;
  for(const [cx,cy] of SQUID_SITES){
    for(let i=0;i<FLUX_N;i++){
      const u1=Math.max(Math.random(),1e-9), u2=Math.random();
      const r=FLUX_SIGMA*Math.sqrt(-2*Math.log(u1));
      const a=u2*Math.PI*2;
      const ox=Math.min(r,FLUX_CUTOFF)*Math.cos(a);
      const oy=Math.min(r,FLUX_CUTOFF)*Math.sin(a);
      fluxLines.push({cx,cy,ox,oy, phase:Math.random()});
    }
  }
}

function updateFire(dt){
  fluxPhase=(fluxPhase+FLUX_SPEED*dt/GAP)%1;
}

function project(wx,wz,wy,vx,vw,vh){
  const m=MVP;
  const cx2=m[0]*wx+m[4]*wz+m[8]*wy+m[12];
  const cy2=m[1]*wx+m[5]*wz+m[9]*wy+m[13];
  const cw =m[3]*wx+m[7]*wz+m[11]*wy+m[15];
  if(cw<=0.01) return null;
  return [vx+(cx2/cw+1)*0.5*vw, (1-cy2/cw)*0.5*vh];
}

function drawFire(vx,vw,vh){
  if(!fireCanvas){
    fireCanvas=document.createElement('canvas');
    fireCanvas.style.cssText='position:fixed;top:0;left:0;pointer-events:none;z-index:5;';
    document.body.appendChild(fireCanvas);
    fireCtx=fireCanvas.getContext('2d');
  }
  const W=cv.width,H=cv.height;
  if(fireCanvas.width!==W||fireCanvas.height!==H){
    fireCanvas.width=W; fireCanvas.height=H;
    fireCanvas.style.width=W+'px'; fireCanvas.style.height=H+'px';
  }
  fireCtx.clearRect(vx,0,vw,vh);
  const eyeX=pos.x, eyeY=pos.y;

  // Q-chip glow spots
  for(const [cx,cy] of SQUID_SITES){
    const dist=Math.hypot(cx-eyeX,cy-eyeY);
    if(dist>FLUX_VIS) continue;
    if(bumpOccludesLOS(cx,cy)) continue;
    const fade=Math.min(1,(FLUX_VIS-dist)/(FLUX_VIS-200));
    const top=project(cx,GAP,cy,vx,vw,vh);
    if(!top) continue;
    const [sx,sy]=top;
    if(sx<vx-80||sx>vx+vw+80||sy<-80||sy>vh+80) continue;
    const gr=Math.max(6,50*fade);
    const g=fireCtx.createRadialGradient(sx,sy,0,sx,sy,gr);
    g.addColorStop(0,  `rgba(255,255,140,${fade*0.9})`);
    g.addColorStop(0.4,`rgba(255,200,30,${fade*0.6})`);
    g.addColorStop(1,  `rgba(255,80,0,0)`);
    fireCtx.fillStyle=g;
    fireCtx.beginPath(); fireCtx.arc(sx,sy,gr,0,Math.PI*2); fireCtx.fill();
  }

  // Flux lines with animated arrowheads
  for(const ln of fluxLines){
    const wx=ln.cx+ln.ox, wy=ln.cy+ln.oy;
    const dist=Math.hypot(wx-eyeX,wy-eyeY);
    if(dist>FLUX_VIS) continue;
    if(bumpOccludesLOS(wx,wy)) continue;
    const fade=Math.min(1,(FLUX_VIS-dist)/(FLUX_VIS-200));

    const bot=project(wx,0,  wy,vx,vw,vh);
    const top=project(wx,GAP,wy,vx,vw,vh);
    if(!bot||!top) continue;

    const dx=top[0]-bot[0], dy=top[1]-bot[1];
    const len=Math.hypot(dx,dy);
    if(len<2) continue;

    // Line: magenta→orange→yellow gradient
    const gl2=fireCtx.createLinearGradient(bot[0],bot[1],top[0],top[1]);
    gl2.addColorStop(0,  `rgba(255,0,120,${fade*0.8})`);
    gl2.addColorStop(0.5,`rgba(255,140,0,${fade*0.9})`);
    gl2.addColorStop(1,  `rgba(255,255,80,${fade*0.95})`);
    fireCtx.strokeStyle=gl2;
    fireCtx.lineWidth=Math.max(0.8,2.5*fade);
    fireCtx.beginPath();
    fireCtx.moveTo(bot[0],bot[1]);
    fireCtx.lineTo(top[0],top[1]);
    fireCtx.stroke();

    // Animated arrowhead travelling upward
    const t=(fluxPhase+ln.phase)%1;
    const ax=bot[0]+dx*t, ay=bot[1]+dy*t;
    const ux=dx/len, uy=dy/len;
    const as=Math.max(3,5*fade);
    fireCtx.fillStyle=`rgba(255,240,80,${fade})`;
    fireCtx.beginPath();
    fireCtx.moveTo(ax+ux*as,        ay+uy*as);
    fireCtx.lineTo(ax-uy*as*0.5,    ay+ux*as*0.5);
    fireCtx.lineTo(ax+uy*as*0.5,    ay-ux*as*0.5);
    fireCtx.closePath();
    fireCtx.fill();
  }
}

// ── BUMP SPATIAL GRID for fast occlusion ──────────────
let bumpGrid=null;
const BGRID_CELL=30;
function buildBumpGrid(){
  if(!data) return;
  bumpGrid=new Map();
  for(const [bx,by] of data.bumps){
    const gx=Math.floor(bx/BGRID_CELL), gy=Math.floor(by/BGRID_CELL);
    for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
      const key=`${gx+dx},${gy+dy}`;
      if(!bumpGrid.has(key)) bumpGrid.set(key,[]);
      bumpGrid.get(key).push([bx,by]);
    }
  }
}

// Line-of-sight: returns true if a bump blocks the view from eye to (tx,ty)
// Checks bumps along the 2D horizontal path eye→target
function bumpOccludesLOS(tx, ty){
  if(!bumpGrid) return false;
  const ex=pos.x, ey=pos.y;
  const dx=tx-ex, dy=ty-ey;
  const dist=Math.hypot(dx,dy);
  if(dist<1) return false;
  // Sample along the line at BRAD intervals
  const steps=Math.ceil(dist/(BRAD*2));
  for(let s=1;s<steps;s++){
    const t=s/steps;
    const px=ex+dx*t, py=ey+dy*t;
    const key=`${Math.floor(px/BGRID_CELL)},${Math.floor(py/BGRID_CELL)}`;
    const cell=bumpGrid.get(key);
    if(!cell) continue;
    for(const [bx,by] of cell){
      if(Math.hypot(px-bx,py-by)<BRAD) return true;
    }
  }
  return false;
}
// 20 hexagonal qubits on Q-chip (layer 1004, z=GAP)
// Drum equation: ψ = Σ sin(nπx/W)sin(mπy/H)cos(2πf·t)
// Visualized as color fill inside qubit bbox, pulsing at ~2Hz
let qubits = [];
let waveTime = 0;
let waveCanvas = null, waveCtx = null;
const WAVE_VIS  = 1000;  // visibility um
const WAVE_FREQ = 2.0;   // Hz base frequency
const WAVE_GRID = 20;    // grid resolution
const WAVE_MODES = [
  [1,1, 1.00],  // fundamental
  [2,1, 0.35],  // 2nd harmonic x
  [1,2, 0.35],  // 2nd harmonic y
  [3,1, 0.12],
  [1,3, 0.12],
  [2,2, 0.18],
];

function updateWaves(dt){
  waveTime += dt/1000; // seconds
}

function drawWaves(vx, vw, vh){
  if(!qubits.length) return;
  if(!waveCanvas){
    waveCanvas=document.createElement('canvas');
    waveCanvas.style.cssText='position:fixed;top:0;left:0;pointer-events:none;z-index:4;';
    document.body.appendChild(waveCanvas);
    waveCtx=waveCanvas.getContext('2d');
  }
  const W=cv.width,H=cv.height;
  if(waveCanvas.width!==W||waveCanvas.height!==H){
    waveCanvas.width=W; waveCanvas.height=H;
    waveCanvas.style.width=W+'px'; waveCanvas.style.height=H+'px';
  }
  waveCtx.clearRect(vx,0,vw,vh);
  const eyeX=pos.x, eyeY=pos.y;

  for(const q of qubits){
    const dist=Math.hypot(q.cx-eyeX, q.cy-eyeY);
    if(dist>WAVE_VIS) continue;
    if(bumpOccludesLOS(q.cx, q.cy)) continue;
    const fade=Math.min(1,(WAVE_VIS-dist)/(WAVE_VIS-50));

    // Project all grid points, collect screen positions + wave amplitude
    const pts2d = [];
    let minSX=Infinity,maxSX=-Infinity,minSY=Infinity,maxSY=-Infinity;

    for(let gi=0;gi<=WAVE_GRID;gi++){
      for(let gj=0;gj<=WAVE_GRID;gj++){
        const nx=gi/WAVE_GRID, ny=gj/WAVE_GRID;
        const wx=q.x0+nx*q.w, wy=q.y0+ny*q.h;
        // Drum modes — each qubit has unique phase offset
        let amp=0;
        for(const [n,m,a] of WAVE_MODES){
          const f=WAVE_FREQ*Math.sqrt(n*n+m*m);
          amp += a*Math.sin(n*Math.PI*nx)*Math.sin(m*Math.PI*ny)
                  *Math.cos(2*Math.PI*f*waveTime + q.phase);
        }
        amp /= WAVE_MODES.reduce((s,[,,a])=>s+a,0);

        // Surface oscillates 0..+10µm ABOVE the Q-chip surface (never into the gap)
        const wz = GAP + Math.max(0, amp) * 10.0;
        const sc=project(wx,wz,wy,vx,vw,vh);
        if(!sc) continue;

        pts2d.push({sx:sc[0],sy:sc[1],amp});
        if(sc[0]<minSX)minSX=sc[0]; if(sc[0]>maxSX)maxSX=sc[0];
        if(sc[1]<minSY)minSY=sc[1]; if(sc[1]>maxSY)maxSY=sc[1];
      }
    }
    if(!pts2d.length) continue;
    if(maxSX<vx||minSX>vx+vw||maxSY<0||minSY>vh) continue;

    // Draw as colored rectangles (screen-space grid cells)
    const cellW=(maxSX-minSX)/WAVE_GRID;
    const cellH=(maxSY-minSY)/WAVE_GRID;
    const cw=Math.max(1,cellW), ch=Math.max(1,cellH);

    for(const {sx,sy,amp} of pts2d){
      const t=(amp+1)/2; // 0..1
      // Color: negative = deep blue, zero = dark teal, positive = bright cyan/white
      const rr=Math.floor(t*120);
      const gg=Math.floor(40+t*215);
      const bb=Math.floor(120+t*135);
      const alpha=fade*(0.10+Math.abs(amp)*0.40); // reduced max alpha
      waveCtx.fillStyle=`rgba(${rr},${gg},${bb},${alpha})`;
      waveCtx.fillRect(sx-cw/2,sy-ch/2,cw+0.5,ch+0.5);
    }

    // Draw qubit outline
    if(q.pts && q.pts.length>2){
      waveCtx.strokeStyle=`rgba(80,255,200,${fade*0.7})`;
      waveCtx.lineWidth=1;
      waveCtx.beginPath();
      let first=true;
      for(const [px,py] of q.pts){
        const sc=project(px,GAP,py,vx,vw,vh);
        if(!sc) continue;
        first ? waveCtx.moveTo(sc[0],sc[1]) : waveCtx.lineTo(sc[0],sc[1]);
        first=false;
      }
      waveCtx.closePath();
      waveCtx.stroke();
    }
  }
}

// ── SIGNAL LINES (Layer 135) ──────────────────────────
// Running light particles with comet trail ("שובל")
// Particles flow along each line segment
let signalLines = [];   // from signal_data.json
let resonatorData = []; // resonators per qubit
let sigTime = 0;
const SIG_VIS    = 1000;  // visibility um
const SIG_SPEED  = 0.005; // fast particles
const SIG_NPART  = 12;   // many particles per line — busy feel

// Unique color per resonator (hue varies)
const RES_COLORS = [
  [0,255,255],[80,200,255],[160,120,255],[255,80,200],
  [255,160,0],[200,255,0],[0,255,160],[255,100,100],
  [100,180,255],[255,220,80],[180,255,100],[255,60,180],
  [60,220,255],[255,140,60],[140,255,180],[200,100,255],
  [255,200,60],[80,255,200],[255,80,80],[100,255,140],
];

let sigCanvas=null, sigCtx=null;

function updateSignals(dt){
  sigTime = (sigTime + SIG_SPEED*dt) % 1;
}

function drawSignals(vx, vw, vh){
  if(!signalLines.length) return;
  if(!sigCanvas){
    sigCanvas=document.createElement('canvas');
    sigCanvas.style.cssText='position:fixed;top:0;left:0;pointer-events:none;z-index:6;';
    document.body.appendChild(sigCanvas);
    sigCtx=sigCanvas.getContext('2d');
  }
  const W=cv.width,H=cv.height;
  if(sigCanvas.width!==W||sigCanvas.height!==H){
    sigCanvas.width=W; sigCanvas.height=H;
    sigCanvas.style.width=W+'px'; sigCanvas.style.height=H+'px';
  }
  sigCtx.clearRect(vx,0,vw,vh);
  const eyeX=pos.x, eyeY=pos.y;

  for(const ln of signalLines){
    // Line midpoint for distance check
    const pts=ln.pts;
    if(pts.length<2) continue;
    const mx=pts[Math.floor(pts.length/2)][0];
    const my=pts[Math.floor(pts.length/2)][1];
    const dist=Math.hypot(mx-eyeX,my-eyeY);
    if(dist>SIG_VIS) continue;
    if(bumpOccludesLOS(mx,my)) continue;
    const fade=Math.min(1,(SIG_VIS-dist)/(SIG_VIS-100));

    // Draw dim baseline line
    sigCtx.strokeStyle=`rgba(100,180,255,${fade*0.2})`;
    sigCtx.lineWidth=1;
    sigCtx.beginPath();
    let first=true;
    for(const [wx,wy] of pts){
      const sc=project(wx,2.0,wy,vx,vw,vh); // 2um above C-chip surface
      if(!sc) continue;
      first?sigCtx.moveTo(sc[0],sc[1]):sigCtx.lineTo(sc[0],sc[1]);
      first=false;
    }
    sigCtx.stroke();

    // Compute cumulative arc length for each point
    const cumLen=[0];
    for(let i=1;i<pts.length;i++){
      cumLen.push(cumLen[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
    }
    const totalLen=cumLen[cumLen.length-1];
    if(totalLen<1) continue;

    // Draw SIG_NPART individual fast particles — no trail, just bright dots
    for(let p=0;p<SIG_NPART;p++){
      const t=((sigTime*3 + p/SIG_NPART + ln.offset)%1);
      const d=t*totalLen;
      let seg=0;
      for(;seg<cumLen.length-1;seg++) if(cumLen[seg+1]>=d) break;
      seg=Math.min(seg,pts.length-2);
      const sf=(d-cumLen[seg])/Math.max(0.001,cumLen[seg+1]-cumLen[seg]);
      const wx=pts[seg][0]+(pts[seg+1][0]-pts[seg][0])*sf;
      const wy=pts[seg][1]+(pts[seg+1][1]-pts[seg][1])*sf;
      const sc=project(wx,2.0,wy,vx,vw,vh); // just above C-chip
      if(!sc) continue;
      const [sx,sy]=sc;
      if(sx<vx-4||sx>vx+vw+4||sy<-4||sy>vh+4) continue;
      const sz=Math.max(2, 3.5*fade);
      // Shiny: bright white core with blue-white glow halo
      const grd=sigCtx.createRadialGradient(sx-sz*0.3,sy-sz*0.3,0, sx,sy,sz*2.2);
      grd.addColorStop(0,   `rgba(255,255,255,${fade})`);
      grd.addColorStop(0.3, `rgba(200,230,255,${fade*0.9})`);
      grd.addColorStop(0.7, `rgba(100,180,255,${fade*0.5})`);
      grd.addColorStop(1,   `rgba(60,120,255,0)`);
      sigCtx.fillStyle=grd;
      sigCtx.beginPath();
      sigCtx.arc(sx,sy,sz*2.2,0,Math.PI*2);
      sigCtx.fill();
    }
  }
}

// ── RESONATORS (Layer 7) ──────────────────────────────
// Standing wave patterns along each resonator's path segments
// Each resonator has a unique color, oscillates at ~5GHz (visualized ~1Hz)
const RES_WAVE_FREQ = 1.5; // Hz visual frequency
let resCanvas=null, resCtx=null;

function drawResonators(vx, vw, vh){
  if(!resonatorData.length) return;
  if(!resCanvas){
    resCanvas=document.createElement('canvas');
    resCanvas.style.cssText='position:fixed;top:0;left:0;pointer-events:none;z-index:3;';
    document.body.appendChild(resCanvas);
    resCtx=resCanvas.getContext('2d');
  }
  const W=cv.width,H=cv.height;
  if(resCanvas.width!==W||resCanvas.height!==H){
    resCanvas.width=W; resCanvas.height=H;
    resCanvas.style.width=W+'px'; resCanvas.style.height=H+'px';
  }
  resCtx.clearRect(vx,0,vw,vh);
  const eyeX=pos.x, eyeY=pos.y;

  for(let ri=0; ri<resonatorData.length; ri++){
    const res=resonatorData[ri];
    const dist=Math.hypot(res.cx-eyeX,res.cy-eyeY);
    if(dist>SIG_VIS) continue;
    if(bumpOccludesLOS(res.cx,res.cy)) continue;
    const fade=Math.min(1,(SIG_VIS-dist)/(SIG_VIS-100));
    const [cr,cg,cb]=RES_COLORS[ri%RES_COLORS.length];

    // Draw each segment as a standing wave
    for(const seg of res.segs){
      if(seg.length<2) continue;
      // Compute cumulative length
      const cumLen=[0];
      for(let i=1;i<seg.length;i++)
        cumLen.push(cumLen[i-1]+Math.hypot(seg[i][0]-seg[i-1][0],seg[i][1]-seg[i-1][1]));
      const totalLen=cumLen[cumLen.length-1];
      if(totalLen<10) continue;

      // Standing wave: sample 30 points along segment
      const N=30;
      resCtx.beginPath();
      let started=false;
      for(let k=0;k<=N;k++){
        const d=(k/N)*totalLen;
        let seg2=0;
        for(;seg2<cumLen.length-1;seg2++) if(cumLen[seg2+1]>=d) break;
        seg2=Math.min(seg2,seg.length-2);
        const sf=(d-cumLen[seg2])/Math.max(0.001,cumLen[seg2+1]-cumLen[seg2]);
        const wx=seg[seg2][0]+(seg[seg2+1][0]-seg[seg2][0])*sf;
        const wy=seg[seg2][1]+(seg[seg2+1][1]-seg[seg2][1])*sf;
        // Standing wave: half-sine envelope * time oscillation
        const standAmp=Math.sin(Math.PI*k/N)*Math.cos(2*Math.PI*RES_WAVE_FREQ*waveTime+res.phase)*3;
        // Perp offset in 3D (offset in Z = altitude)
        const wz=GAP+standAmp;
        const sc=project(wx,wz,wy,vx,vw,vh);
        if(!sc) continue;
        started?resCtx.lineTo(sc[0],sc[1]):resCtx.moveTo(sc[0],sc[1]);
        started=true;
      }
      const alpha=fade*0.7;
      resCtx.strokeStyle=`rgba(${cr},${cg},${cb},${alpha})`;
      resCtx.lineWidth=Math.max(0.8,1.5*fade);
      resCtx.stroke();
    }
  }
}

// ── SHADERS ────────────────────────────────────────────
// Color scheme: deep space black bg, Nb = warm ivory-white, Si = midnight navy,
// In bumps = acid green, foot disks = bright lime, Q-box = steel blue

// Flat shader for Nb planes — distance fog + forward spotlight
const VS_F=`
attribute vec2 aXZ;uniform mat4 uM;uniform float uY;varying vec3 vW;
void main(){vW=vec3(aXZ.x,uY,aXZ.y);gl_Position=uM*vec4(aXZ.x,uY,aXZ.y,1);}`;
const FS_F=`
precision highp float;
uniform vec4 uC;uniform vec3 uE;uniform vec3 uD;
varying vec3 vW;
void main(){
  vec3 dv=vW-uE; float dist=length(dv);
  // base: bright enough to always see — ivory/white Nb
  float base=0.80;
  // landing light: tight cone 1200um ahead
  float ca=dot(normalize(dv),normalize(uD));
  float spot=smoothstep(0.70,0.95,ca)*max(0.0,1.0-dist/1200.0)*1.8;
  // near-field glow: bright within 300um regardless of direction
  float near=max(0.0,1.0-dist/300.0)*0.6;
  float b=clamp(base+spot+near,0.0,2.0);
  gl_FragColor=vec4(uC.rgb*b,1.0);
}`;

// 3D shader for bumps/floor/boxes
const VS_3=`
attribute vec3 aP;attribute vec3 aN;uniform mat4 uM;varying vec3 vP;varying vec3 vN;
void main(){vP=aP;vN=aN;gl_Position=uM*vec4(aP,1);}`;
const FS_3=`
precision highp float;
uniform vec4 uC;uniform vec3 uE;uniform vec3 uD;
varying vec3 vP;varying vec3 vN;
void main(){
  vec3 N=normalize(vN);
  vec3 dv=vP-uE; float dist=length(dv);
  vec3 toE=normalize(-dv);
  // diffuse from eye-light
  float diff=max(dot(N,toE),0.0);
  // specular
  float spec=pow(max(dot(reflect(normalize(dv),N),toE),0.0),40.0)*0.55;
  // landing spotlight on geometry
  float ca=dot(normalize(dv),normalize(uD));
  float cone=smoothstep(0.70,0.95,ca)*max(0.0,1.0-dist/1200.0);
  float near=max(0.0,1.0-dist/300.0);
  // rim glow
  float rim=pow(1.0-max(dot(N,toE),0.0),3.0)*0.18;
  float light=0.55+diff*0.5+spec*0.4+(diff+spec)*cone*2.0+near*0.5+rim;
  gl_FragColor=vec4(uC.rgb*clamp(light,0.0,2.0),1.0);
}`;

function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x;}
function prog(vs,fs){const p=gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);return p;}
const PF=prog(VS_F,FS_F), P3=prog(VS_3,FS_3);

// ── COLORS (new scheme) ──────────────────────────────

// Si:  deep midnight blue — dark, receding

const COL={
  nbBot: new Float32Array([0.78,0.82,0.90,1]),  // blue-silver (C-chip bottom Nb)
  nbTop: new Float32Array([0.88,0.80,0.80,1]),  // red-silver  (Q-chip top Nb)
  si:    new Float32Array([0.12,0.13,0.16,1]),  // dark gray silicon
  bump:  new Float32Array([0.38,0.52,0.40,1]),  // muted grayish-green indium
  foot:  new Float32Array([0.45,0.60,0.48,1]),  // slightly brighter foot disk
  qbox:  new Float32Array([0.30,0.38,0.52,1]),  // steel blue Q-chip side
  bg:    new Float32Array([0.00,0.00,0.02,1]),  // near-black
};

// ── MATRIX ────────────────────────────────────────────
const m4=()=>new Float32Array(16);
function id(m){for(let i=0;i<16;i++)m[i]=0;m[0]=m[5]=m[10]=m[15]=1;return m;}
function mul(a,b,o){for(let r=0;r<4;r++)for(let c=0;c<4;c++){let s=0;
  for(let k=0;k<4;k++)s+=a[r+k*4]*b[k+c*4];o[r+c*4]=s;}return o;}
function persp(fov,asp,n,f,m){const t=1/Math.tan(fov*Math.PI/360);id(m);
  m[0]=t/asp;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);m[15]=0;return m;}
function ry(a,m){id(m);const c=Math.cos(a),s=Math.sin(a);m[0]=c;m[8]=s;m[2]=-s;m[10]=c;return m;}
function rx(a,m){id(m);const c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=-s;m[9]=s;m[10]=c;return m;}
function tr(x,y,z,m){id(m);m[12]=x;m[13]=y;m[14]=z;return m;}
const mP=m4(),mY=m4(),mX=m4(),mT=m4(),MVP=m4(),tmp=m4();
function buildMVP(ex,ey,ez,yd,pd,fov,asp){
  persp(fov,asp,0.5,120000,mP);
  ry(-yd*Math.PI/180,mY); rx(-pd*Math.PI/180,mX); tr(-ex,-ey,-ez,mT);
  mul(mY,mT,tmp);mul(mX,tmp,tmp);mul(mP,tmp,MVP);
}

// ── BUFFERS ───────────────────────────────────────────
function mkBuf(data,tgt){const b=gl.createBuffer();
  gl.bindBuffer(tgt,b);gl.bufferData(tgt,data,gl.STATIC_DRAW);return b;}
function flatBuf(v,i){return{vb:mkBuf(new Float32Array(v),gl.ARRAY_BUFFER),
  ib:mkBuf(new Uint32Array(i),gl.ELEMENT_ARRAY_BUFFER),n:i.length};}
function buf3D(v,i){return{vb:mkBuf(new Float32Array(v),gl.ARRAY_BUFFER),
  ib:mkBuf(new Uint32Array(i),gl.ELEMENT_ARRAY_BUFFER),n:i.length};}

// ── DRAW HELPERS ──────────────────────────────────────
let EX=0,EY=0,EZ=0,DX=0,DY=0,DZ=1;
function ul(p,n){return gl.getUniformLocation(p,n);}

function drawFlat(b,yH,col){
  gl.useProgram(PF);
  gl.uniformMatrix4fv(ul(PF,'uM'),false,MVP);
  gl.uniform4fv(ul(PF,'uC'),col);
  gl.uniform1f(ul(PF,'uY'),yH);
  gl.uniform3f(ul(PF,'uE'),EX,EY,EZ);
  gl.uniform3f(ul(PF,'uD'),DX,DY,DZ);
  const a=gl.getAttribLocation(PF,'aXZ');
  gl.bindBuffer(gl.ARRAY_BUFFER,b.vb);
  gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b.ib);
  gl.drawElements(gl.TRIANGLES,b.n,gl.UNSIGNED_INT,0);
}
function draw3D(b,col){
  gl.useProgram(P3);
  gl.uniformMatrix4fv(ul(P3,'uM'),false,MVP);
  gl.uniform4fv(ul(P3,'uC'),col);
  gl.uniform3f(ul(P3,'uE'),EX,EY,EZ);
  gl.uniform3f(ul(P3,'uD'),DX,DY,DZ);
  const ap=gl.getAttribLocation(P3,'aP'), an=gl.getAttribLocation(P3,'aN');
  gl.bindBuffer(gl.ARRAY_BUFFER,b.vb);
  gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,3,gl.FLOAT,false,24,0);
  gl.enableVertexAttribArray(an);gl.vertexAttribPointer(an,3,gl.FLOAT,false,24,12);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b.ib);
  gl.drawElements(gl.TRIANGLES,b.n,gl.UNSIGNED_INT,0);
}

// ── GEOMETRY ──────────────────────────────────────────
// Silicon floor
function mkSiFloor(){
  const m=CMIN,mx=CMAX,y=-NBT;
  return buf3D([m,y,m,0,1,0, mx,y,m,0,1,0, mx,y,mx,0,1,0, m,y,mx,0,1,0],[0,1,2,0,2,3]);
}
// Silicon ceiling (top of Q-chip silicon, above GAP)
function mkSiCeil(){
  const m=QMIN,mx=QMAX,y=GAP+NBT+0.1;
  return buf3D([m,y,m,0,-1,0, mx,y,m,0,-1,0, mx,y,mx,0,-1,0, m,y,mx,0,-1,0],[0,2,1,0,3,2]);
}
// Q-chip side box
function mkQBox(){
  const x0=QMIN,x1=QMAX,z0=QMIN,z1=QMAX,yb=GAP+NBT,yt=GAP+300;
  function face(pts,n){const r=[];for(const v of pts)r.push(...v,...n);return r;}
  const v=[
    ...face([[x0,yt,z0],[x1,yt,z0],[x1,yt,z1],[x0,yt,z1]],[0,1,0]),
    ...face([[x0,yb,z0],[x1,yb,z0],[x1,yb,z1],[x0,yb,z1]],[0,-1,0]),
    ...face([[x0,yb,z0],[x1,yb,z0],[x1,yt,z0],[x0,yt,z0]],[0,0,-1]),
    ...face([[x1,yb,z0],[x1,yb,z1],[x1,yt,z1],[x1,yt,z0]],[1,0,0]),
    ...face([[x1,yb,z1],[x0,yb,z1],[x0,yt,z1],[x1,yt,z1]],[0,0,1]),
    ...face([[x0,yb,z1],[x0,yb,z0],[x0,yt,z0],[x0,yt,z1]],[-1,0,0]),
  ];
  const idx=[];for(let f=0;f<6;f++)idx.push(f*4,f*4+1,f*4+2,f*4,f*4+2,f*4+3);
  return buf3D(v,idx);
}

// Bumps: cylinder r=15um + foot disks r=20um, h=1um at top and bottom
function mkBumps(bumps){
  const vArr=[],iArr=[];
  let base=0;
  function addVert(x,y,z,nx,ny,nz){vArr.push(x,y,z,nx,ny,nz);}
  function disk(cx,cz,y,ny,r,thick,flipped){
    // flat disk, normal = ±Y
    const c0=base; addVert(cx,y,cz,0,ny,0);
    for(let s=0;s<SEGS;s++){
      const a=(s/SEGS)*Math.PI*2;
      addVert(cx+r*Math.cos(a),y,cz+r*Math.sin(a),0,ny,0);
    }
    for(let s=0;s<SEGS;s++)
      flipped? iArr.push(c0,c0+1+(s+1)%SEGS,c0+1+s)
             : iArr.push(c0,c0+1+s,c0+1+(s+1)%SEGS);
    base+=SEGS+1;
    // side ring of disk
    const side0=base;
    for(let s=0;s<SEGS;s++){
      const a=(s/SEGS)*Math.PI*2;
      const nx=Math.cos(a),nz=Math.sin(a);
      addVert(cx+r*nx,y,      cz+r*nz,nx,0,nz);
      addVert(cx+r*nx,y+thick*ny,cz+r*nz,nx,0,nz);
    }
    for(let s=0;s<SEGS;s++){
      const n=(s+1)%SEGS;
      iArr.push(side0+s*2,side0+n*2,side0+s*2+1);
      iArr.push(side0+n*2,side0+n*2+1,side0+s*2+1);
    }
    base+=SEGS*2;
  }
  function cylinder(cx,cz,yb,yt,r){
    const s0=base;
    for(let s=0;s<SEGS;s++){
      const a=(s/SEGS)*Math.PI*2,nx=Math.cos(a),nz=Math.sin(a);
      addVert(cx+r*nx,yb,cz+r*nz,nx,0,nz);
      addVert(cx+r*nx,yt,cz+r*nz,nx,0,nz);
    }
    for(let s=0;s<SEGS;s++){
      const n=(s+1)%SEGS;
      iArr.push(s0+s*2,s0+n*2,s0+s*2+1,s0+n*2,s0+n*2+1,s0+s*2+1);
    }
    base+=SEGS*2;
  }
  for(const [cx,cy] of bumps){
    // bottom foot disk: sits on top of bottom Nb (y=0), extends upward 1um
    disk(cx,cy, 0,      1, BFOOT, BFOOT_H, false);
    // top foot disk: hangs below top Nb (y=GAP), extends downward 1um
    disk(cx,cy, GAP,   -1, BFOOT, BFOOT_H, true);
    // cylinder body between foot disks
    cylinder(cx,cy, BFOOT_H, GAP-BFOOT_H, BRAD);
  }
  return buf3D(vArr,iArr);
}

// ── RENDER ────────────────────────────────────────────
let bL130=null,bL2=null,bL3=null,bBumps=null,bSiFloor=null,bSiCeil=null,bQBox=null;

function renderEye(ex,ey,ez,yd,pd,vx,vw,vh){
  gl.viewport(vx,0,vw,vh);
  gl.scissor(vx,0,vw,vh);
  gl.enable(gl.SCISSOR_TEST);
  gl.clearColor(...COL.bg);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  buildMVP(ex,ey,ez,yd,pd,70,vw/vh);
  EX=ex;EY=ey;EZ=ez;
  // forward vector (world: X=chipX, Y=alt, Z=chipY)
  const yr=yd*Math.PI/180,pr=pd*Math.PI/180;
  DX=-Math.sin(yr)*Math.cos(pr);
  DY= Math.sin(pr);
  DZ=-Math.cos(yr)*Math.cos(pr);

  draw3D(bSiFloor,  COL.si);
  draw3D(bSiCeil,   COL.si);
  if(bL130) drawFlat(bL130, 0,   COL.nbBot);
  if(bL2)   drawFlat(bL2,   GAP, COL.nbTop);
  if(bL3)   drawFlat(bL3,   GAP, COL.nbTop);
  draw3D(bQBox,     COL.qbox);
  draw3D(bBumps,    COL.bump);
  drawFire(vx, vw, vh);
  drawWaves(vx, vw, vh);
  drawSignals(vx, vw, vh);
  drawResonators(vx, vw, vh);
}


function render(){
  const W=cv.width,H=cv.height;
  const ex=pos.x, ey=GAP/2, ez=pos.y;
  const pc=Math.max(-65,Math.min(65,pitch));
  if(mode3D){
    const IPD=250; // um — interpupillary distance scaled to chip world
    const yr=yaw*Math.PI/180;
    const rx=Math.cos(yr), rz=-Math.sin(yr);
    renderEye(ex-rx*IPD/2, ey, ez-rz*IPD/2, yaw, pc, 0,   W/2, H);
    renderEye(ex+rx*IPD/2, ey, ez+rz*IPD/2, yaw, pc, W/2, W/2, H);
  } else {
    renderEye(ex, ey, ez, yaw, pc, 0, W, H);
  }
  updateHUD();
}

// ── MINIMAP ───────────────────────────────────────────
const mm=document.getElementById('minimap'), mx=mm.getContext('2d');
function drawMinimap(){
  const W=72,H=72,M=3;
  mx.clearRect(0,0,W,H);
  mx.fillStyle='#000a04'; mx.fillRect(0,0,W,H);
  function mapX(wx){return M+(wx-CMIN)/(CMAX-CMIN)*(W-2*M);}
  function mapY(wy){return M+(wy-CMIN)/(CMAX-CMIN)*(H-2*M);}
  // C-chip outline
  mx.strokeStyle='#0054ff'; mx.lineWidth=1;
  mx.strokeRect(M,M,W-2*M,H-2*M);
  // Q-chip
  mx.fillStyle='rgba(0,40,120,0.35)';
  mx.fillRect(mapX(QMIN),mapY(QMIN),mapX(QMAX)-mapX(QMIN),mapY(QMAX)-mapY(QMIN));
  mx.strokeStyle='#4af'; mx.lineWidth=0.8;
  mx.strokeRect(mapX(QMIN),mapY(QMIN),mapX(QMAX)-mapX(QMIN),mapY(QMAX)-mapY(QMIN));
  // Qubit dots
  for(const q of qubits){
    const qpx=mapX(q.cx), qpy=mapY(q.cy);
    mx.beginPath(); mx.arc(qpx,qpy,2,0,Math.PI*2);
    mx.fillStyle='rgba(80,200,255,0.8)'; mx.fill();
  }
  // Direction arrow + dot (player)
  const px=mapX(pos.x), py=mapY(pos.y);
  const yr=yaw*Math.PI/180;
  mx.strokeStyle='#ff0'; mx.lineWidth=1.5;
  mx.beginPath(); mx.moveTo(px,py);
  mx.lineTo(px-Math.sin(yr)*6, py-Math.cos(yr)*6);
  mx.stroke();
  mx.beginPath(); mx.arc(px,py,2.5,0,Math.PI*2);
  mx.fillStyle='#ff0'; mx.fill();
}
function updateHUD(){
  document.getElementById('dpos').textContent=`${(pos.x-CCX).toFixed(0)}, ${(pos.y-CCY).toFixed(0)} µm`;
  document.getElementById('dhdg').textContent=`HDG ${((yaw%360+360)%360).toFixed(0)}°`;
  document.getElementById('dspd').textContent=`${spd} µm/s`;
  drawMinimap();
}

// ── PHYSICS ───────────────────────────────────────────
// Player is LOCKED to GAP/2 altitude — no vertical movement
// Pitch only affects camera look direction, not position
const PRAD=4;
let lastT=null;
function fly(ts){
  try{
    const dt=lastT?Math.min((ts-lastT)/1000,0.05):0.016; lastT=ts;
    if(!paused){
      const yr=yaw*Math.PI/180;
      let nx=pos.x+(-Math.sin(yr))*spd*dt;
      let ny=pos.y+(-Math.cos(yr))*spd*dt;
      let nz=GAP*0.5;
      let hit=false;
      if(nx<CMIN+PRAD){nx=CMIN+PRAD+30;hit=true;}
      if(nx>CMAX-PRAD){nx=CMAX-PRAD-30;hit=true;}
      if(ny<CMIN+PRAD){ny=CMIN+PRAD+30;hit=true;}
      if(ny>CMAX-PRAD){ny=CMAX-PRAD-30;hit=true;}
      if(data && bumpGrid){
        const key=`${Math.floor(nx/BGRID_CELL)},${Math.floor(ny/BGRID_CELL)}`;
        const cell=bumpGrid.get(key);
        if(cell){
          for(const [bx,by] of cell){
            const d=Math.hypot(nx-bx,ny-by);
            if(d<BRAD+PRAD){
              const a=Math.atan2(ny-by,nx-bx);
              nx=bx+(BRAD+PRAD+30)*Math.cos(a);
              ny=by+(BRAD+PRAD+30)*Math.sin(a);
              doBumpHit(); break;
            }
          }
        }
      }
      pos.x=nx;pos.y=ny;pos.z=nz;
      if(hit)doHit();
    }
    updateFire(dt*1000);
    updateWaves(dt*1000);
    updateSignals(dt*1000);
    render();
  }catch(e){
    console.error('fly error:',e);
  }
  requestAnimationFrame(fly);
}
let bumpHits=0;

function doHit(){
  if(inHit)return;inHit=true;
  // Count only bump hits (not wall hits) — called from bump collision block
  const f=document.getElementById('hit');
  f.style.display='block';
  if(navigator.vibrate)navigator.vibrate(60);
  setTimeout(()=>{f.style.display='none';inHit=false;},150);
}
function doBumpHit(){
  bumpHits++;
  document.getElementById('dbumps').textContent=`💥 ${bumpHits} hits`;
  pitch=0; // reset pitch so we don't get stuck looking at floor
  doHit();
}

// ── INPUT ─────────────────────────────────────────────
const keys={};
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',  e=>keys[e.key]=false);
setInterval(()=>{
  if(keys['ArrowLeft'] ||keys['a']) yaw-=1.5;
  if(keys['ArrowRight']||keys['d']) yaw+=1.5;
  if(keys['ArrowUp']   ||keys['w']) pitch=Math.min(70,pitch+1);
  if(keys['ArrowDown'] ||keys['s']) pitch=Math.max(-70,pitch-1);
},16);

// Touch: horizontal swipe = yaw, vertical swipe = pitch
let tx0=null, ty0=null;
window.addEventListener('touchstart',e=>{
  if(e.target.closest('.btn')||e.target.closest('#spd')||e.target.closest('#dashboard'))return;
  tx0=e.touches[0].clientX; ty0=e.touches[0].clientY;
},{passive:true});
window.addEventListener('touchmove',e=>{
  if(tx0===null)return;
  const dx=e.touches[0].clientX-tx0;
  const dy=e.touches[0].clientY-ty0;
  yaw   += dx*0.15;
  pitch  = Math.max(-70,Math.min(70, pitch - dy*0.15)); // drag up = pitch up
  tx0=e.touches[0].clientX; ty0=e.touches[0].clientY;
},{passive:true});
window.addEventListener('touchend',()=>{tx0=null;ty0=null;});

// ── GYRO ──────────────────────────────────────────────
// Phone in LANDSCAPE:
// VERTICAL axis (short side of screen, floor-to-ceiling):
//   Rotating around this = beta changes = RUDDER/YAW
//   Rate-based: tilt top toward you → turn right
// HORIZONTAL axis (long side of screen, left-to-right):
//   Tilting around this = gamma changes = PITCH VIEW ONLY (±45° max)
//   Does NOT affect movement direction

let gyroCalibrated=false, calBeta=90, calGamma=0, fBeta=90, fGamma=0;
const SMOOTH=0.10;
let oriCount=0;
let gyroYawBase=START_YAW; // heading at moment gyro was calibrated

window.addEventListener('deviceorientation', e=>{
  oriCount++;
  if(!gyroOn)
    document.getElementById('gdbg').textContent=
      `#${oriCount} β:${(e.beta??0).toFixed(0)} γ:${(e.gamma??0).toFixed(0)}`;
},{passive:true});

function toggleGyro(){
  if(typeof DeviceOrientationEvent!=='undefined'&&
     typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(s=>{
      if(s==='granted'){
        gyroOn=true; gyroCalibrated=false; gyroYawBase=yaw;
        window.addEventListener('deviceorientation',onOri,{passive:true});
        document.getElementById('bgy').classList.add('on');
        document.getElementById('bgy').textContent='✈ GYRO ON';
      }
    });
  } else {
    gyroOn=!gyroOn; gyroCalibrated=false;
    if(gyroOn){ gyroYawBase=yaw; window.addEventListener('deviceorientation',onOri,{passive:true}); }
    else{ window.removeEventListener('deviceorientation',onOri); pitch=0; }
    document.getElementById('bgy').classList.toggle('on',gyroOn);
    document.getElementById('bgy').textContent=gyroOn?'✈ GYRO ON':'✈ GYRO';
  }
}

function onOri(e){
  if(!gyroOn) return;
  const a=e.alpha??0, b=e.beta??0, g=e.gamma??0;
  if(!gyroCalibrated){
    calBeta=a; calGamma=g; fBeta=a; fGamma=g;
    gyroCalibrated=true; return;
  }
  let da=a-fBeta; if(da>180)da-=360; if(da<-180)da+=360;
  fBeta+=SMOOTH*da;
  fGamma+=SMOOTH*(g-fGamma);
  const rAlpha=fBeta-calBeta;
  const rGamma=fGamma-calGamma;
  document.getElementById('gdbg').textContent=
    `Δα:${rAlpha.toFixed(0)} Δγ:${rGamma.toFixed(0)}\nyaw:${yaw.toFixed(0)}°`;
  // Direct offset from heading at calibration — no acceleration
  yaw = gyroYawBase + rAlpha * 2.5;
  pitch = Math.max(-35, Math.min(35, rGamma*1.2));
}

// ── CONTROLS ──────────────────────────────────────────
function togglePause(){
  paused=!paused;
  const btn=document.getElementById('bpause');
  btn.textContent=paused?'▶ RESUME':'⏸ PAUSE';
  btn.classList.toggle('on',paused);
}
function resetPos(){
  pos={x:START.x,y:START.y};yaw=START_YAW;pitch=0;
  gyroCalibrated=false;
  bumpHits=0;
  document.getElementById('dbumps').textContent='💥 0 hits';
}
function toggleFS(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
    document.getElementById('bfs').textContent='✕ EXIT FULL';
  } else { document.exitFullscreen(); }
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement)document.getElementById('bfs').textContent='⛶ FULLSCREEN';
});
function toggle3D(){
  mode3D=!mode3D;
  document.getElementById('b3d').classList.toggle('on',mode3D);
  document.getElementById('vsep').style.display=mode3D?'block':'none';
  // In 3D mode: hide speed buttons (no finger access), auto-enable gyro
  document.getElementById('bslow').style.display=mode3D?'none':'';
  document.getElementById('bfast').style.display=mode3D?'none':'';
  if(mode3D && !gyroOn) toggleGyro();
  cv.style.filter='none';
  if(fireCanvas)  fireCanvas.style.filter='none';
  if(waveCanvas)  waveCanvas.style.filter='none';
  if(sigCanvas)   sigCanvas.style.filter='none';
  if(resCanvas)   resCanvas.style.filter='none';
}
function chSpd(d){
  sIdx=Math.max(0,Math.min(SPEEDS.length-1,sIdx+d));
  spd=SPEEDS[sIdx];
  document.getElementById('dspd').textContent=`${spd} µm/s`;
}
window.addEventListener('resize',()=>{cv.width=window.innerWidth;cv.height=window.innerHeight;});

// ── LOAD ──────────────────────────────────────────────
function lp(p,m){document.getElementById('pfill').style.width=p+'%';
  document.getElementById('lstatus').textContent=m;}
async function init(){
  lp(5,'Fetching geometry…');
  let r;
  try {
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),15000);
    r=await fetch('chip_data.json?v=11',{signal:ctrl.signal});
    clearTimeout(tid);
    if(!r.ok) throw new Error(`HTTP ${r.status} — chip_data.json not found. Upload it to GitHub!`);
  } catch(e){
    lp(0,'❌ '+e.message);
    document.getElementById('lstatus').style.color='#f44';
    return;
  }
  lp(30,'Parsing…');
  data=await r.json();
  lp(55,'GPU: layers…');
  bL130=flatBuf(data.layer130.verts,data.layer130.indices);
  lp(63,'GPU: L2…');
  bL2  =flatBuf(data.layer2.verts,  data.layer2.indices);
  lp(70,'GPU: L3…');
  bL3  =flatBuf(data.layer3.verts,  data.layer3.indices);
  lp(78,'Building bumps…');
  bBumps  =mkBumps(data.bumps);
  lp(90,'Building scene…');
  bSiFloor=mkSiFloor();
  bSiCeil =mkSiCeil();
  bQBox   =mkQBox();
  buildBumpGrid();
  initFire();
  // Load qubit standing wave data
  fetch('qubit_data.json').then(r=>r.json()).then(qd=>{
    qubits = qd.qubits.map(q=>({
      ...q,
      x0: q.x0 ?? q.cx-q.w/2,
      y0: q.y0 ?? q.cy-q.h/2,
      phase: Math.random()*Math.PI*2
    }));
    console.log('Qubits loaded:', qubits.length);
  }).catch(e=>console.warn('qubit_data.json not found',e));

  fetch('signal_data.json').then(r=>r.json()).then(sd=>{
    signalLines = sd.signal_lines.map(l=>({...l, offset:Math.random()}));
    resonatorData = sd.resonators.map(r=>({...r, phase:Math.random()*Math.PI*2}));
    console.log('Signals loaded:', signalLines.length, 'lines,', resonatorData.length, 'resonators');
  }).catch(e=>console.warn('signal_data.json not found',e));
  lp(100,'Ready!');
  setTimeout(()=>{
    document.getElementById('loading').style.display='none';
    acquireWakeLock();
    requestAnimationFrame(fly);
  },200);
}
init().catch(e=>{document.getElementById('lstatus').textContent='Error: '+e.message;console.error(e);});
</script>
