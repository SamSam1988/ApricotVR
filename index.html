<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Superconducting Flip-Chip VR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#0ff;}
canvas{display:block;}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;}
#dashboard{
  position:absolute;bottom:10px;left:10px;
  background:rgba(0,15,30,0.88);border:1px solid #0ff;
  border-radius:8px;padding:10px 14px;min-width:180px;pointer-events:none;
}
#dashboard h3{font-size:11px;color:#0ff;letter-spacing:2px;margin-bottom:6px;}
.dval{font-size:13px;color:#7ff;margin:2px 0;}
#horizon-canvas{display:block;margin:6px auto;border:1px solid #0ff;border-radius:50%;}
#controls{
  position:absolute;bottom:10px;right:10px;
  display:flex;flex-direction:column;gap:6px;pointer-events:all;
}
.btn{
  background:rgba(0,40,80,0.92);border:1px solid #0ff;
  color:#0ff;padding:8px 14px;border-radius:6px;
  font-family:'Courier New',monospace;font-size:12px;
  cursor:pointer;text-align:center;min-width:100px;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.btn:active{background:rgba(0,80,160,0.9);}
.btn.active{background:rgba(0,100,0,0.9);border-color:#0f0;color:#0f0;}
#speed-display{
  position:absolute;top:10px;right:10px;
  background:rgba(0,15,30,0.88);border:1px solid #0ff;
  border-radius:6px;padding:6px 12px;font-size:12px;pointer-events:all;
}
#loading{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:100;
  color:#0ff;font-size:16px;gap:12px;
}
#progress-bar{width:300px;height:4px;background:#002;border:1px solid #0ff;border-radius:2px;}

#collision-flash{
  position:fixed;top:0;left:0;width:100%;height:100%;

}
#vr-sep{position:fixed;top:0;left:50%;width:3px;height:100%;background:#000;z-index:9;display:none;}
</style>
</head>
<body>
<div id="loading">
  <div>⚛ SUPERCONDUCTING FLIP-CHIP VR</div>
  <div id="load-status">Loading geometry…</div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
</div>
<div id="collision-flash"></div>
<div id="vr-sep"></div>
<canvas id="c"></canvas>
<div id="ui">
  <div id="dashboard">
    <h3>◈ COCKPIT</h3>
    <canvas id="horizon-canvas" width="80" height="80"></canvas>
    <div class="dval" id="d-alt">Alt: 40.0 µm</div>
    <div class="dval" id="d-pos">X: 0 µm</div>
    <div class="dval" id="d-posy">Y: 0 µm</div>
    <div class="dval" id="d-hdg">Hdg: 0°</div>
    <div class="dval" id="d-zone">Zone: Q-CHIP</div>
  </div>
  <div id="controls">
    <div class="btn" id="btn-fs"   onclick="toggleFS()">⛶ FULLSCREEN</div>
    <div class="btn" id="btn-3d"   onclick="toggle3D()">📱 3D MODE</div>
    <div class="btn" id="btn-gyro" onclick="toggleGyro()">🧭 GYRO ON</div>
    <div class="btn" onclick="changeSpeed(-1)">🐢 SLOWER</div>
    <div class="btn" onclick="changeSpeed(1)">🐇 FASTER</div>
  </div>
  <div id="speed-display">Speed: <span id="speed-val">100</span> µm/s</div>
</div>
<script>
// ═══════════════════════════════════
// CONSTANTS (micrometers)
// ═══════════════════════════════════
const CHIP_CX=8300, CHIP_CY=8300;
const C_SIZE=16400, Q_SIZE=11500;
const C_MIN=CHIP_CX-C_SIZE/2, C_MAX=CHIP_CX+C_SIZE/2;
const Q_MIN=CHIP_CX-Q_SIZE/2, Q_MAX=CHIP_CX+Q_SIZE/2;
const GAP=80;           // um between Nb surfaces
const NB_T=0.5;         // Nb thickness
const P_RAD=4;          // player collision radius
const SEGS=20;          // cylinder segments

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
let chipData=null;
let mode3D=false, gyroActive=false;
let speed=100;
let pos={x:CHIP_CX, y:CHIP_CY, z:GAP/2};
let yaw=0, pitch=0;
let inCollision=false;

// ═══════════════════════════════════
// CANVAS + WebGL
// ═══════════════════════════════════
const canvas=document.getElementById('c');
canvas.width=window.innerWidth; canvas.height=window.innerHeight;
const gl=canvas.getContext('webgl',{antialias:true,depth:true});
gl.getExtension('OES_element_index_uint');

// ═══════════════════════════════════
// SHADERS
// ═══════════════════════════════════
// Flat layer shader (Nb planes) — simple diffuse, high ambient
const VS_FLAT=`
attribute vec2 aXZ;
uniform mat4 uMVP;
uniform float uY;
varying vec2 vXZ;
void main(){
  vXZ=aXZ;
  gl_Position=uMVP*vec4(aXZ.x,uY,aXZ.y,1.0);
}`;
const FS_FLAT=`
precision mediump float;
uniform vec4  uCol;
uniform vec3  uEye;    // eye world pos
uniform float uY;
varying vec2  vXZ;
void main(){
  // Distance-based diffuse: brighter when closer
  vec3 frag=vec3(vXZ.x,uY,vXZ.y);
  float d=length(uEye-frag);
  float bright=clamp(1.0-d/5000.0,0.0,1.0);
  bright=0.55+bright*0.45;  // 0.55 min ambient, up to 1.0 nearby
  gl_FragColor=vec4(uCol.rgb*bright, uCol.a);
}`;

// 3D object shader (bumps, boxes, floor) — full Phong
const VS_3D=`
attribute vec3 aPos;
attribute vec3 aNrm;
uniform mat4 uMVP;
varying vec3 vPos;
varying vec3 vNrm;
void main(){
  vPos=aPos; vNrm=aNrm;
  gl_Position=uMVP*vec4(aPos,1.0);
}`;
const FS_3D=`
precision mediump float;
uniform vec4 uCol;
uniform vec3 uEye;
varying vec3 vPos;
varying vec3 vNrm;
void main(){
  vec3 N=normalize(vNrm);
  vec3 L=normalize(uEye-vPos);
  vec3 V=L; // viewer == light
  vec3 H=normalize(L+V);
  float d=length(uEye-vPos);
  float att=clamp(1.0-d/8000.0,0.0,1.0);
  float diff=max(dot(N,L),0.0);
  float spec=pow(max(dot(N,H),0.0),48.0)*0.7;
  float rim=pow(1.0-max(dot(N,V),0.0),2.5)*0.25;
  float light=0.50+diff*att*1.0+spec*att+rim;
  gl_FragColor=vec4(uCol.rgb*light,uCol.a);
}`;

function mkSh(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));
  return s;
}
function mkProg(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,mkSh(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,mkSh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  return p;
}
const progFlat=mkProg(VS_FLAT,FS_FLAT);
const prog3D  =mkProg(VS_3D,  FS_3D);

// ═══════════════════════════════════
// COLORS
// ═══════════════════════════════════
// Nb: bright silver-white
const C_NB_BOT=[0.90,0.93,0.98,1];
const C_NB_TOP=[0.85,0.89,0.95,1];
// Silicon: dark blue-grey
const C_SI    =[0.07,0.10,0.20,1];
// Indium bumps: dark green with metallic sheen
const C_IN    =[0.08,0.48,0.18,1];
// Q-chip side: deep navy
const C_QSIDE =[0.06,0.08,0.18,1];
// Background: near-black with slight blue tint
const C_BG    =[0.01,0.01,0.04,1];

// ═══════════════════════════════════
// MATRIX UTILS
// ═══════════════════════════════════
function m4(){return new Float32Array(16);}
function ident(m){
  for(let i=0;i<16;i++)m[i]=0;
  m[0]=m[5]=m[10]=m[15]=1; return m;
}
function mulM(a,b,o){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    let s=0;for(let k=0;k<4;k++)s+=a[r+k*4]*b[k+c*4];
    o[r+c*4]=s;
  }return o;
}
function persp(fov,asp,n,f,m){
  const t=1/Math.tan(fov*Math.PI/360); ident(m);
  m[0]=t/asp;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);m[15]=0;
  return m;
}
function rotY(a,m){ident(m);const c=Math.cos(a),s=Math.sin(a);m[0]=c;m[8]=s;m[2]=-s;m[10]=c;return m;}
function rotX(a,m){ident(m);const c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=-s;m[9]=s;m[10]=c;return m;}
function trans(x,y,z,m){ident(m);m[12]=x;m[13]=y;m[14]=z;return m;}

const mP=m4(),mRY=m4(),mRX=m4(),mT=m4(),mMVP=m4(),mTmp=m4();
function buildMVP(ex,ey,ez,yDeg,pDeg,fov,asp){
  persp(fov,asp,0.5,100000,mP);
  rotY(-yDeg*Math.PI/180,mRY);
  rotX(-pDeg*Math.PI/180,mRX);
  trans(-ex,-ey,-ez,mT);
  mulM(mRY,mT,mTmp); mulM(mRX,mTmp,mTmp); mulM(mP,mTmp,mMVP);
}

// ═══════════════════════════════════
// BUFFER HELPERS
// ═══════════════════════════════════
function makeBuf(data,target){
  const b=gl.createBuffer();
  gl.bindBuffer(target,b);
  gl.bufferData(target,data,gl.STATIC_DRAW);
  return b;
}
function uploadFlat(verts,idxs){
  return{
    vb:makeBuf(new Float32Array(verts),gl.ARRAY_BUFFER),
    ib:makeBuf(new Uint32Array(idxs),gl.ELEMENT_ARRAY_BUFFER),
    n:idxs.length
  };
}
function upload3D(verts,idxs){// verts: x,y,z,nx,ny,nz interleaved
  return{
    vb:makeBuf(new Float32Array(verts),gl.ARRAY_BUFFER),
    ib:makeBuf(new Uint32Array(idxs),gl.ELEMENT_ARRAY_BUFFER),
    n:idxs.length
  };
}

// ═══════════════════════════════════
// DRAW FLAT LAYER (Nb planes)
// ═══════════════════════════════════
let gEyeX=0,gEyeY=0,gEyeZ=0;

function uLoc(p,n){return gl.getUniformLocation(p,n);}
function drawFlat(buf,yH,col){
  gl.useProgram(progFlat);
  gl.uniformMatrix4fv(uLoc(progFlat,'uMVP'),false,mMVP);
  gl.uniform4fv(uLoc(progFlat,'uCol'),col);
  gl.uniform1f(uLoc(progFlat,'uY'),yH);
  gl.uniform3f(uLoc(progFlat,'uEye'),gEyeX,gEyeY,gEyeZ);
  const aXZ=gl.getAttribLocation(progFlat,'aXZ');
  gl.bindBuffer(gl.ARRAY_BUFFER,buf.vb);
  gl.enableVertexAttribArray(aXZ);
  gl.vertexAttribPointer(aXZ,2,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,buf.ib);
  gl.drawElements(gl.TRIANGLES,buf.n,gl.UNSIGNED_INT,0);
}

// ═══════════════════════════════════
// DRAW 3D OBJECT (bumps, box, floor)
// ═══════════════════════════════════
function draw3D(buf,col){
  gl.useProgram(prog3D);
  gl.uniformMatrix4fv(uLoc(prog3D,'uMVP'),false,mMVP);
  gl.uniform4fv(uLoc(prog3D,'uCol'),col);
  gl.uniform3f(uLoc(prog3D,'uEye'),gEyeX,gEyeY,gEyeZ);
  const aPos=gl.getAttribLocation(prog3D,'aPos');
  const aNrm=gl.getAttribLocation(prog3D,'aNrm');
  gl.bindBuffer(gl.ARRAY_BUFFER,buf.vb);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,24,0);
  gl.enableVertexAttribArray(aNrm);
  gl.vertexAttribPointer(aNrm,3,gl.FLOAT,false,24,12);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,buf.ib);
  gl.drawElements(gl.TRIANGLES,buf.n,gl.UNSIGNED_INT,0);
}

// ═══════════════════════════════════
// GEOMETRY BUILDERS
// ═══════════════════════════════════
function buildCylinders(bumps){
  const vArr=[],iArr=[];
  let base=0;
  for(const [cx,cy] of bumps){
    const r=20, bot=0, top=GAP;
    // sides with per-vertex normals
    for(let s=0;s<SEGS;s++){
      const a=(s/SEGS)*Math.PI*2;
      const nx=Math.cos(a), nz=Math.sin(a);
      const x=cx+r*nx, z=cy+r*nz;
      vArr.push(x,bot,z,nx,0,nz,  x,top,z,nx,0,nz);
    }
    for(let s=0;s<SEGS;s++){
      const n=(s+1)%SEGS;
      const b0=base+s*2,t0=base+s*2+1,b1=base+n*2,t1=base+n*2+1;
      iArr.push(b0,b1,t0, b1,t1,t0);
    }
    // top cap
    const tc=base+SEGS*2;
    vArr.push(cx,top,cy, 0,1,0);
    for(let s=0;s<SEGS;s++){
      const a=(s/SEGS)*Math.PI*2;
      vArr.push(cx+r*Math.cos(a),top,cy+r*Math.sin(a), 0,1,0);
    }
    for(let s=0;s<SEGS;s++) iArr.push(tc,tc+1+s,tc+1+(s+1)%SEGS);
    // bot cap
    const bc=tc+SEGS+1;
    vArr.push(cx,bot,cy, 0,-1,0);
    for(let s=0;s<SEGS;s++){
      const a=(s/SEGS)*Math.PI*2;
      vArr.push(cx+r*Math.cos(a),bot,cy+r*Math.sin(a), 0,-1,0);
    }
    for(let s=0;s<SEGS;s++) iArr.push(bc,bc+1+(s+1)%SEGS,bc+1+s);
    base+=SEGS*2+(SEGS+1)*2;
  }
  return upload3D(vArr,iArr);
}

function buildSiFloor(){
  const m=C_MIN,mx=C_MAX,y=-NB_T;
  return upload3D(
    [m,y,m,0,1,0, mx,y,m,0,1,0, mx,y,mx,0,1,0, m,y,mx,0,1,0],
    [0,1,2,0,2,3]
  );
}

function buildQBox(){
  const x0=Q_MIN,x1=Q_MAX,z0=Q_MIN,z1=Q_MAX,yb=GAP,yt=GAP+300;
  function face(p,n){const r=[];for(const v of p)r.push(...v,...n);return r;}
  const v=[
    ...face([[x0,yt,z0],[x1,yt,z0],[x1,yt,z1],[x0,yt,z1]],[0,1,0]),
    ...face([[x0,yb,z0],[x1,yb,z0],[x1,yb,z1],[x0,yb,z1]],[0,-1,0]),
    ...face([[x0,yb,z0],[x1,yb,z0],[x1,yt,z0],[x0,yt,z0]],[0,0,-1]),
    ...face([[x1,yb,z0],[x1,yb,z1],[x1,yt,z1],[x1,yt,z0]],[1,0,0]),
    ...face([[x1,yb,z1],[x0,yb,z1],[x0,yt,z1],[x1,yt,z1]],[0,0,1]),
    ...face([[x0,yb,z1],[x0,yb,z0],[x0,yt,z0],[x0,yt,z1]],[-1,0,0]),
  ];
  const idx=[];
  for(let f=0;f<6;f++) idx.push(f*4,f*4+1,f*4+2, f*4,f*4+2,f*4+3);
  return upload3D(v,idx);
}

// ═══════════════════════════════════
// RENDER
// ═══════════════════════════════════
let bufL130=null,bufL2=null,bufL3=null,bufBumps=null,bufSiFloor=null,bufQBox=null;

function renderEye(ex,ey,ez,yDeg,pDeg,vpX,vpW,vpH){
  gl.viewport(vpX,0,vpW,vpH);
  gl.clearColor(...C_BG);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);

  buildMVP(ex,ey,ez,yDeg,pDeg,70,vpW/vpH);
  gEyeX=ex; gEyeY=ey; gEyeZ=ez;

  // Draw order: far to near roughly
  draw3D(bufSiFloor, C_SI);
  if(bufL130) drawFlat(bufL130, 0,   C_NB_BOT);
  if(bufL2)   drawFlat(bufL2,   GAP, C_NB_TOP);
  if(bufL3)   drawFlat(bufL3,   GAP, C_NB_TOP);
  draw3D(bufQBox,   C_QSIDE);
  draw3D(bufBumps,  C_IN);
}

function render(){
  const W=canvas.width,H=canvas.height;
  // WebGL Y = altitude (pos.z), chip X/Z map to pos.x/pos.y
  const ex=pos.x, ey=pos.z, ez=pos.y;
  const pc=Math.max(-65,Math.min(65,pitch));
  if(mode3D){
    renderEye(ex,ey,ez,yaw,pc, 0,   W/2,H);
    renderEye(ex,ey,ez,yaw,pc, W/2, W/2,H);
  } else {
    renderEye(ex,ey,ez,yaw,pc, 0,W,H);
  }
  drawHorizon(pc,yaw);
  updateHUD();
}

// ═══════════════════════════════════
// ARTIFICIAL HORIZON
// ═══════════════════════════════════
const hc=document.getElementById('horizon-canvas');
const hx=hc.getContext('2d');
function drawHorizon(pDeg,yDeg){
  const w=80,h=80,cx=40,cy=40,r=36;
  hx.clearRect(0,0,w,h);
  hx.save();
  hx.beginPath();hx.arc(cx,cy,r,0,Math.PI*2);hx.clip();
  const off=(pDeg/90)*r;
  // sky (above horizon)
  hx.fillStyle='#000814';hx.fillRect(0,0,w,h);
  // ground (below)
  hx.fillStyle='#0a1a0a';hx.fillRect(0,cy+off,w,h-cy-off+4);
  // horizon
  hx.strokeStyle='#00ffaa';hx.lineWidth=1.5;
  hx.beginPath();hx.moveTo(0,cy+off);hx.lineTo(w,cy+off);hx.stroke();
  // airplane symbol
  hx.strokeStyle='#ffffff';hx.lineWidth=1.5;
  hx.beginPath();hx.moveTo(cx-12,cy);hx.lineTo(cx-4,cy);hx.stroke();
  hx.beginPath();hx.moveTo(cx+4,cy);hx.lineTo(cx+12,cy);hx.stroke();
  hx.beginPath();hx.arc(cx,cy,2.5,0,Math.PI*2);hx.fillStyle='#fff';hx.fill();
  hx.restore();
  hx.strokeStyle='#0ff';hx.lineWidth=1;
  hx.beginPath();hx.arc(cx,cy,r,0,Math.PI*2);hx.stroke();
}

function updateHUD(){
  const inQ=pos.x>Q_MIN&&pos.x<Q_MAX&&pos.y>Q_MIN&&pos.y<Q_MAX;
  document.getElementById('d-alt').textContent =`Alt: ${pos.z.toFixed(1)} µm`;
  document.getElementById('d-pos').textContent =`X: ${(pos.x-CHIP_CX).toFixed(0)} µm`;
  document.getElementById('d-posy').textContent=`Y: ${(pos.y-CHIP_CY).toFixed(0)} µm`;
  document.getElementById('d-hdg').textContent =`Hdg: ${((yaw%360+360)%360).toFixed(0)}°`;
  document.getElementById('d-zone').textContent=`Zone: ${inQ?'Q-CHIP':'LAUNCHER'}`;
}

// ═══════════════════════════════════
// FLIGHT PHYSICS
// ═══════════════════════════════════
let lastT=null;
function fly(ts){
  const dt=lastT?Math.min((ts-lastT)/1000,0.05):0.016;
  lastT=ts;
  // Forward vector from yaw+pitch
  const yR=yaw*Math.PI/180, pR=pitch*Math.PI/180;
  const dx=-Math.sin(yR)*Math.cos(pR);
  const dy=-Math.cos(yR)*Math.cos(pR);
  const dz= Math.sin(pR);
  let nx=pos.x+dx*speed*dt;
  let ny=pos.y+dy*speed*dt;
  let nz=pos.z+dz*speed*dt;

  let hit=false;
  if(nx<C_MIN+P_RAD){nx=C_MIN+P_RAD;hit=true;}
  if(nx>C_MAX-P_RAD){nx=C_MAX-P_RAD;hit=true;}
  if(ny<C_MIN+P_RAD){ny=C_MIN+P_RAD;hit=true;}
  if(ny>C_MAX-P_RAD){ny=C_MAX-P_RAD;hit=true;}
  if(nz<P_RAD){nz=P_RAD;hit=true;}
  if(nz>GAP-P_RAD){nz=GAP-P_RAD;hit=true;}

  if(chipData){
    for(const [bx,by,br] of chipData.bumps){
      const d=Math.sqrt((nx-bx)**2+(ny-by)**2);
      if(d<br+P_RAD){
        const a=Math.atan2(ny-by,nx-bx);
        nx=bx+(br+P_RAD)*Math.cos(a);
        ny=by+(br+P_RAD)*Math.sin(a);
        hit=true; break;
      }
    }
  }
  pos.x=nx;pos.y=ny;pos.z=nz;
  if(hit)doCollision();
  render();
  requestAnimationFrame(fly);
}

function doCollision(){
  if(inCollision)return;
  inCollision=true;
  const f=document.getElementById('collision-flash');
  f.style.display='block';
  if(navigator.vibrate)navigator.vibrate([60]);
  setTimeout(()=>{f.style.display='none';inCollision=false;},160);
}

// ═══════════════════════════════════
// INPUT
// ═══════════════════════════════════
const keys={};
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',  e=>keys[e.key]=false);
setInterval(()=>{
  if(keys['ArrowLeft'] ||keys['a']||keys['A']) yaw-=1.8;
  if(keys['ArrowRight']||keys['d']||keys['D']) yaw+=1.8;
  if(keys['ArrowUp']   ||keys['w']||keys['W']) pitch=Math.min(75,pitch+1.2);
  if(keys['ArrowDown'] ||keys['s']||keys['S']) pitch=Math.max(-75,pitch-1.2);
},16);

// Touch swipe for yaw (when gyro off)
let txStart=null;
window.addEventListener('touchstart',e=>{
  if(e.target.closest('.btn')||e.target.closest('#speed-display')||e.target.closest('#dashboard'))return;
  txStart=e.touches[0].clientX;
},{passive:true});
window.addEventListener('touchmove',e=>{
  if(txStart===null)return;
  yaw+=(e.touches[0].clientX-txStart)*0.18;
  txStart=e.touches[0].clientX;
},{passive:true});
window.addEventListener('touchend',()=>txStart=null);

// ═══════════════════════════════════
// GYRO — airplane bank model
// ═══════════════════════════════════
function toggleGyro(){
  gyroActive=!gyroActive;
  const btn=document.getElementById('btn-gyro');
  btn.textContent=gyroActive?'🧭 GYRO ON':'🧭 GYRO OFF';
  btn.classList.toggle('active',gyroActive);
  if(gyroActive){
    const start=()=>window.addEventListener('deviceorientation',onOri);
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(s=>{if(s==='granted')start();});
    } else { start(); }
  } else {
    window.removeEventListener('deviceorientation',onOri);
  }
}

function onOri(e){
  if(!gyroActive)return;
  // gamma = left/right tilt of phone [-90..+90]
  // Tilt RIGHT (+gamma) = bank right = turn RIGHT (yaw increases)
  // Tilt LEFT  (-gamma) = bank left  = turn LEFT  (yaw decreases)
  const bank=e.gamma||0;
  const dead=5;
  if(Math.abs(bank)>dead){
    yaw+=(bank>0?1:-1)*(Math.abs(bank)-dead)*0.08;
  }
  // beta = forward tilt. Phone held ~45-60° forward.
  // Tilt nose forward (beta decreases from 90) = pitch up
  const tilt=e.beta||0;
  // neutral ~55°, full up at ~20°, full down at ~90°
  pitch=Math.max(-70,Math.min(70,(55-tilt)*0.9));
}

// FULLSCREEN / 3D
// ═══════════════════════════════════
function toggleFS(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
    document.getElementById('btn-fs').textContent='✕ EXIT FULL';
  } else {
    document.exitFullscreen();
  }
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement)
    document.getElementById('btn-fs').textContent='⛶ FULLSCREEN';
});

function toggle3D(){
  mode3D=!mode3D;
  document.getElementById('btn-3d').classList.toggle('active',mode3D);
  document.getElementById('vr-sep').style.display=mode3D?'block':'none';
}

const SPEEDS=[10,25,50,100,200,500,1000];
let sIdx=3;
function changeSpeed(d){
  sIdx=Math.max(0,Math.min(SPEEDS.length-1,sIdx+d));
  speed=SPEEDS[sIdx];
  document.getElementById('speed-val').textContent=speed;
}

window.addEventListener('resize',()=>{
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
});

// ═══════════════════════════════════
// LOAD + INIT
// ═══════════════════════════════════
function prog(p,m){
  document.getElementById('progress-fill').style.width=p+'%';
  document.getElementById('load-status').textContent=m;
}

async function init(){
  prog(5,'Fetching geometry…');
  const r=await fetch('chip_data.json');
  prog(30,'Parsing JSON…');
  chipData=await r.json();
  prog(55,'Uploading layers…');

  bufL130=uploadFlat(chipData.layer130.verts, chipData.layer130.indices);
  prog(65,'Layer 2…');
  bufL2  =uploadFlat(chipData.layer2.verts,   chipData.layer2.indices);
  prog(72,'Layer 3…');
  bufL3  =uploadFlat(chipData.layer3.verts,   chipData.layer3.indices);
  prog(80,'Building cylinders…');
  bufBumps  =buildCylinders(chipData.bumps);
  prog(92,'Building scene…');
  bufSiFloor=buildSiFloor();
  bufQBox   =buildQBox();
  prog(100,'Ready!');
  setTimeout(()=>{
    document.getElementById('loading').style.display='none';
    requestAnimationFrame(fly);
  },300);
}
init().catch(e=>{
  document.getElementById('load-status').textContent='Error: '+e.message;
  console.error(e);
});
</script>
