*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#0f8;}
canvas{display:block;}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;}

#loading{

  display:flex;flex-direction:column;align-items:center;justify-content:center;

#pbar{width:260px;height:3px;background:#010;border:1px solid #0a4;border-radius:2px;}
#pfill{height:100%;background:#0f8;width:0%;}

const FLUX_SQUARES=[[12200,13250,88],[10550,11550,88],[9150,11150,88],[11650,8700,93],[12475,8975,95],[2700,12300,88],[6700,11600,88],[6700,12000,88],[6700,9300,88],[6700,9700,88],[5150,7750,88],[5350,5200,88],[7450,5450,88],[6675,5200,88],[2800,6575,88],[4000,7750,88],[11250,7275,88],[11250,6950,88],[9950,4950,88],[9425,4250,88],[10575,2725,88],[13800,3850,88]];

// ── PARTICLE SYSTEM ────────────────────────────────────
// Particles travel along flux line segments, then circle the square pad, then dissolve
const PARTICLE_COUNT = 800;  // total particles across all lines
const PARTICLE_SPEED = 0.0008; // fraction of line length per ms
const particles = [];

function initParticles() {
  // Assign particles to lines proportional to line length
  const lineLengths = FLUX_LINES.map(l => Math.hypot(l[2]-l[0], l[3]-l[1]));
  const totalLen = lineLengths.reduce((a,b)=>a+b,0);
  for(let i=0; i<PARTICLE_COUNT; i++) {
    const lineIdx = Math.floor(Math.random()*FLUX_LINES.length);
    particles.push({
      lineIdx,
      t: Math.random(),  // 0=start, 1=end of segment, >1=circling square, >2=dissolved
      phase: 'line',     // 'line','circle','dissolve'
      circleAngle: 0,
      circleRadius: 0,
      opacity: 1.0,
    });
  }
}

function updateParticles(dt) {
  for(const p of particles) {
    if(p.phase==='line') {
      const l = FLUX_LINES[p.lineIdx];
      const len = Math.hypot(l[2]-l[0], l[3]-l[1]);
      p.t += (PARTICLE_SPEED * dt * 500) / len;
      if(p.t >= 1.0) {
        // Find nearest square to end of this line
        const ex = l[2], ey = l[3];
        let bestSq=null, bestD=Infinity;
        for(const sq of FLUX_SQUARES) {
          const d = Math.hypot(sq[0]-ex, sq[1]-ey);
          if(d<bestD) { bestD=d; bestSq=sq; }
        }
        if(bestSq && bestD < 2000) {
          p.phase='circle';
          p.squareCx = bestSq[0]; p.squareCy = bestSq[1];
          p.circleRadius = bestSq[2]*0.7;
          p.circleAngle = Math.atan2(ey-bestSq[1], ex-bestSq[0]);
          p.circleSpeed = 0.003;
          p.circleCount = 0;
          p.opacity = 1.0;
        } else {
          // restart
          p.t=0; p.lineIdx=Math.floor(Math.random()*FLUX_LINES.length);
        }
      }
    } else if(p.phase==='circle') {
      p.circleAngle += p.circleSpeed * dt;
      p.circleCount += p.circleSpeed * dt;
      if(p.circleCount > Math.PI*3) { // 1.5 loops
        p.phase='dissolve';
      }
    } else if(p.phase==='dissolve') {
      p.opacity -= 0.003*dt;
      if(p.opacity<=0) {
        // restart on a new random line
        p.phase='line';
        p.t=0;
        p.lineIdx=Math.floor(Math.random()*FLUX_LINES.length);
        p.opacity=1.0;
      }
    }
  }
}

function getParticlePos(p) {
  if(p.phase==='line') {
    const l=FLUX_LINES[p.lineIdx];
    return [l[0]+(l[2]-l[0])*p.t, l[1]+(l[3]-l[1])*p.t];
  } else {
    return [
      p.squareCx + Math.cos(p.circleAngle)*p.circleRadius,
      p.squareCy + Math.sin(p.circleAngle)*p.circleRadius
    ];
  }
}

// ── SHADERS ────────────────────────────────────────────

// In bumps = acid green, foot disks = bright lime, Q-box = steel blue

// Flat shader for Nb planes — distance fog + forward spotlight
const VS_F=`
attribute vec2 aXZ;uniform mat4 uM;uniform float uY;varying vec3 vW;
void main(){vW=vec3(aXZ.x,uY,aXZ.y);gl_Position=uM*vec4(aXZ.x,uY,aXZ.y,1);}`;
const FS_F=`
precision highp float;
uniform vec4 uC;uniform vec3 uE;uniform vec3 uD;
varying vec3 vW;
void main(){
  vec3 dv=vW-uE; float dist=length(dv);
  // base: bright enough to always see — ivory/white Nb
  float base=0.80;
  // landing light: tight cone 1200um ahead
  float ca=dot(normalize(dv),normalize(uD));
  float spot=smoothstep(0.70,0.95,ca)*max(0.0,1.0-dist/1200.0)*1.8;
  // near-field glow: bright within 300um regardless of direction
  float near=max(0.0,1.0-dist/300.0)*0.6;
  float b=clamp(base+spot+near,0.0,2.0);
  gl_FragColor=vec4(uC.rgb*b,1.0);
}`;

// 3D shader for bumps/floor/boxes
const VS_3=`
attribute vec3 aP;attribute vec3 aN;uniform mat4 uM;varying vec3 vP;varying vec3 vN;
void main(){vP=aP;vN=aN;gl_Position=uM*vec4(aP,1);}`;
const FS_3=`
precision highp float;
uniform vec4 uC;uniform vec3 uE;uniform vec3 uD;
varying vec3 vP;varying vec3 vN;
void main(){
  vec3 N=normalize(vN);
  vec3 dv=vP-uE; float dist=length(dv);
  vec3 toE=normalize(-dv);
  // diffuse from eye-light
  float diff=max(dot(N,toE),0.0);
  // specular
  float spec=pow(max(dot(reflect(normalize(dv),N),toE),0.0),40.0)*0.55;
  // landing spotlight on geometry
  float ca=dot(normalize(dv),normalize(uD));
  float cone=smoothstep(0.70,0.95,ca)*max(0.0,1.0-dist/1200.0);
  float near=max(0.0,1.0-dist/300.0);
  // rim glow
  float rim=pow(1.0-max(dot(N,toE),0.0),3.0)*0.18;
  float light=0.55+diff*0.5+spec*0.4+(diff+spec)*cone*2.0+near*0.5+rim;
  gl_FragColor=vec4(uC.rgb*clamp(light,0.0,2.0),1.0);
}`;

function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x;}
function prog(vs,fs){const p=gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);return p;}
const PF=prog(VS_F,FS_F), P3=prog(VS_3,FS_3);

// ── COLORS (new scheme) ──────────────────────────────
// Nb:  warm ivory-white — stands out, metallic
// Si:  deep midnight blue — dark, receding
// In:  vivid acid green pillar
// Foot: bright lime ring
// Qbox: steel/slate blue sides
// BG:  near-black deep indigo
const COL={
  nbBot: new Float32Array([0.78,0.82,0.90,1]),  // blue-silver (C-chip bottom Nb)
  nbTop: new Float32Array([0.88,0.80,0.80,1]),  // red-silver  (Q-chip top Nb)
  si:    new Float32Array([0.12,0.13,0.16,1]),  // dark gray silicon
  bump:  new Float32Array([0.38,0.52,0.40,1]),  // muted grayish-green indium
  foot:  new Float32Array([0.45,0.60,0.48,1]),  // slightly brighter foot disk
  qbox:  new Float32Array([0.30,0.38,0.52,1]),  // steel blue Q-chip side
  bg:    new Float32Array([0.00,0.00,0.02,1]),  // near-black
};

// ── MATRIX ────────────────────────────────────────────
const m4=()=>new Float32Array(16);
function id(m){for(let i=0;i<16;i++)m[i]=0;m[0]=m[5]=m[10]=m[15]=1;return m;}
function mul(a,b,o){for(let r=0;r<4;r++)for(let c=0;c<4;c++){let s=0;
  for(let k=0;k<4;k++)s+=a[r+k*4]*b[k+c*4];o[r+c*4]=s;}return o;}
function persp(fov,asp,n,f,m){const t=1/Math.tan(fov*Math.PI/360);id(m);
  m[0]=t/asp;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);m[15]=0;return m;}
function ry(a,m){id(m);const c=Math.cos(a),s=Math.sin(a);m[0]=c;m[8]=s;m[2]=-s;m[10]=c;return m;}
function rx(a,m){id(m);const c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=-s;m[9]=s;m[10]=c;return m;}
function tr(x,y,z,m){id(m);m[12]=x;m[13]=y;m[14]=z;return m;}
const mP=m4(),mY=m4(),mX=m4(),mT=m4(),MVP=m4(),tmp=m4();
function buildMVP(ex,ey,ez,yd,pd,fov,asp){
  persp(fov,asp,0.5,120000,mP);
  ry(-yd*Math.PI/180,mY); rx(-pd*Math.PI/180,mX); tr(-ex,-ey,-ez,mT);
  mul(mY,mT,tmp);mul(mX,tmp,tmp);mul(mP,tmp,MVP);
}

// ── BUFFERS ───────────────────────────────────────────
function mkBuf(data,tgt){const b=gl.createBuffer();
  gl.bindBuffer(tgt,b);gl.bufferData(tgt,data,gl.STATIC_DRAW);return b;}
function flatBuf(v,i){return{vb:mkBuf(new Float32Array(v),gl.ARRAY_BUFFER),
  ib:mkBuf(new Uint32Array(i),gl.ELEMENT_ARRAY_BUFFER),n:i.length};}
function buf3D(v,i){return{vb:mkBuf(new Float32Array(v),gl.ARRAY_BUFFER),
  ib:mkBuf(new Uint32Array(i),gl.ELEMENT_ARRAY_BUFFER),n:i.length};}

// ── DRAW HELPERS ──────────────────────────────────────
let EX=0,EY=0,EZ=0,DX=0,DY=0,DZ=1;
function ul(p,n){return gl.getUniformLocation(p,n);}

function drawFlat(b,yH,col){
  gl.useProgram(PF);
  gl.uniformMatrix4fv(ul(PF,'uM'),false,MVP);
  gl.uniform4fv(ul(PF,'uC'),col);
  gl.uniform1f(ul(PF,'uY'),yH);
  gl.uniform3f(ul(PF,'uE'),EX,EY,EZ);
  gl.uniform3f(ul(PF,'uD'),DX,DY,DZ);
  const a=gl.getAttribLocation(PF,'aXZ');
  gl.bindBuffer(gl.ARRAY_BUFFER,b.vb);
  gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b.ib);
  gl.drawElements(gl.TRIANGLES,b.n,gl.UNSIGNED_INT,0);
}
function draw3D(b,col){
  gl.useProgram(P3);
  gl.uniformMatrix4fv(ul(P3,'uM'),false,MVP);
  gl.uniform4fv(ul(P3,'uC'),col);
  gl.uniform3f(ul(P3,'uE'),EX,EY,EZ);
  gl.uniform3f(ul(P3,'uD'),DX,DY,DZ);
  const ap=gl.getAttribLocation(P3,'aP'), an=gl.getAttribLocation(P3,'aN');
  gl.bindBuffer(gl.ARRAY_BUFFER,b.vb);
  gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,3,gl.FLOAT,false,24,0);
  gl.enableVertexAttribArray(an);gl.vertexAttribPointer(an,3,gl.FLOAT,false,24,12);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b.ib);
  gl.drawElements(gl.TRIANGLES,b.n,gl.UNSIGNED_INT,0);
}

// ── GEOMETRY ──────────────────────────────────────────
// Silicon floor
function mkSiFloor(){
  const m=CMIN,mx=CMAX,y=-NBT;
  return buf3D([m,y,m,0,1,0, mx,y,m,0,1,0, mx,y,mx,0,1,0, m,y,mx,0,1,0],[0,1,2,0,2,3]);
}
// Silicon ceiling (top of Q-chip silicon, above GAP)
function mkSiCeil(){
  const m=QMIN,mx=QMAX,y=GAP+NBT+0.1;
  return buf3D([m,y,m,0,-1,0, mx,y,m,0,-1,0, mx,y,mx,0,-1,0, m,y,mx,0,-1,0],[0,2,1,0,3,2]);
}
// Q-chip side box
function mkQBox(){
  const x0=QMIN,x1=QMAX,z0=QMIN,z1=QMAX,yb=GAP+NBT,yt=GAP+300;
  function face(pts,n){const r=[];for(const v of pts)r.push(...v,...n);return r;}
  const v=[
    ...face([[x0,yt,z0],[x1,yt,z0],[x1,yt,z1],[x0,yt,z1]],[0,1,0]),
    ...face([[x0,yb,z0],[x1,yb,z0],[x1,yb,z1],[x0,yb,z1]],[0,-1,0]),
    ...face([[x0,yb,z0],[x1,yb,z0],[x1,yt,z0],[x0,yt,z0]],[0,0,-1]),
    ...face([[x1,yb,z0],[x1,yb,z1],[x1,yt,z1],[x1,yt,z0]],[1,0,0]),
    ...face([[x1,yb,z1],[x0,yb,z1],[x0,yt,z1],[x1,yt,z1]],[0,0,1]),
    ...face([[x0,yb,z1],[x0,yb,z0],[x0,yt,z0],[x0,yt,z1]],[-1,0,0]),
  ];
  const idx=[];for(let f=0;f<6;f++)idx.push(f*4,f*4+1,f*4+2,f*4,f*4+2,f*4+3);
  return buf3D(v,idx);
}

// Bumps: cylinder r=15um + foot disks r=20um, h=1um at top and bottom
function mkBumps(bumps){
  const vArr=[],iArr=[];
  let base=0;
  function addVert(x,y,z,nx,ny,nz){vArr.push(x,y,z,nx,ny,nz);}
  function disk(cx,cz,y,ny,r,thick,flipped){
    // flat disk, normal = ±Y
    const c0=base; addVert(cx,y,cz,0,ny,0);
    for(let s=0;s<SEGS;s++){
      const a=(s/SEGS)*Math.PI*2;
      addVert(cx+r*Math.cos(a),y,cz+r*Math.sin(a),0,ny,0);
    }
    for(let s=0;s<SEGS;s++)
      flipped? iArr.push(c0,c0+1+(s+1)%SEGS,c0+1+s)
             : iArr.push(c0,c0+1+s,c0+1+(s+1)%SEGS);
    base+=SEGS+1;
    // side ring of disk
    const side0=base;
    for(let s=0;s<SEGS;s++){
      const a=(s/SEGS)*Math.PI*2;
      const nx=Math.cos(a),nz=Math.sin(a);
      addVert(cx+r*nx,y,      cz+r*nz,nx,0,nz);
      addVert(cx+r*nx,y+thick*ny,cz+r*nz,nx,0,nz);
    }
    for(let s=0;s<SEGS;s++){
      const n=(s+1)%SEGS;
      iArr.push(side0+s*2,side0+n*2,side0+s*2+1);
      iArr.push(side0+n*2,side0+n*2+1,side0+s*2+1);
    }
    base+=SEGS*2;
  }
  function cylinder(cx,cz,yb,yt,r){
    const s0=base;
    for(let s=0;s<SEGS;s++){
      const a=(s/SEGS)*Math.PI*2,nx=Math.cos(a),nz=Math.sin(a);
      addVert(cx+r*nx,yb,cz+r*nz,nx,0,nz);
      addVert(cx+r*nx,yt,cz+r*nz,nx,0,nz);
    }
    for(let s=0;s<SEGS;s++){
      const n=(s+1)%SEGS;
      iArr.push(s0+s*2,s0+n*2,s0+s*2+1,s0+n*2,s0+n*2+1,s0+s*2+1);
    }
    base+=SEGS*2;
  }
  for(const [cx,cy] of bumps){
    // bottom foot disk: sits on top of bottom Nb (y=0), extends upward 1um
    disk(cx,cy, 0,      1, BFOOT, BFOOT_H, false);
    // top foot disk: hangs below top Nb (y=GAP), extends downward 1um
    disk(cx,cy, GAP,   -1, BFOOT, BFOOT_H, true);
    // cylinder body between foot disks
    cylinder(cx,cy, BFOOT_H, GAP-BFOOT_H, BRAD);
  }
  return buf3D(vArr,iArr);
}

// ── RENDER ────────────────────────────────────────────
let bL130=null,bL2=null,bL3=null,bBumps=null,bSiFloor=null,bSiCeil=null,bQBox=null;

function renderEye(ex,ey,ez,yd,pd,vx,vw,vh){
  gl.viewport(vx,0,vw,vh);
  gl.clearColor(...COL.bg);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  buildMVP(ex,ey,ez,yd,pd,70,vw/vh);
  EX=ex;EY=ey;EZ=ez;
  // forward vector (world: X=chipX, Y=alt, Z=chipY)
  const yr=yd*Math.PI/180,pr=pd*Math.PI/180;
  DX=-Math.sin(yr)*Math.cos(pr);
  DY= Math.sin(pr);
  DZ=-Math.cos(yr)*Math.cos(pr);

  draw3D(bSiFloor,  COL.si);
  draw3D(bSiCeil,   COL.si);
  if(bL130) drawFlat(bL130, 0,   COL.nbBot);
  if(bL2)   drawFlat(bL2,   GAP, COL.nbTop);
  if(bL3)   drawFlat(bL3,   GAP, COL.nbTop);
  draw3D(bQBox,     COL.qbox);
  draw3D(bBumps,    COL.bump);
  drawParticles();
}

// ── PARTICLE SHADER ────────────────────────────────────
const VS_P=`
attribute vec3 aPos;
attribute float aOpa;
uniform mat4 uM;
varying float vOpa;
void main(){
  vOpa=aOpa;
  gl_Position=uM*vec4(aPos,1.0);
  gl_PointSize=4.0;
}`;
const FS_P=`
precision mediump float;
varying float vOpa;
void main(){
  vec2 c=gl_PointCoord-0.5;
  float r=length(c)*2.0;
  float glow=exp(-r*r*3.0);
  gl_FragColor=vec4(1.0,0.95,0.2,glow*vOpa);
}`;
const PP=prog(VS_P,FS_P);
const pBuf=gl.createBuffer();

function drawParticles(){
  if(!particles.length) return;
  const verts=[];
  const Y=GAP*0.5+2; // just above midpoint so visible
  for(const p of particles){
    if(p.phase==='dissolve'&&p.opacity<=0) continue;
    const [wx,wy]=getParticlePos(p);
    verts.push(wx, Y, wy, p.opacity);
  }
  if(!verts.length) return;
  gl.useProgram(PP);
  gl.uniformMatrix4fv(gl.getUniformLocation(PP,'uM'),false,mMVP);
  gl.bindBuffer(gl.ARRAY_BUFFER,pBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.DYNAMIC_DRAW);
  const aPos=gl.getAttribLocation(PP,'aPos');
  const aOpa=gl.getAttribLocation(PP,'aOpa');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,16,0);
  gl.enableVertexAttribArray(aOpa);
  gl.vertexAttribPointer(aOpa,1,gl.FLOAT,false,16,12);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE); // additive blend = glow effect
  gl.drawArrays(gl.POINTS,0,verts.length/4);
  gl.disable(gl.BLEND);
}

function render(){
  const W=cv.width,H=cv.height;
  const ex=pos.x, ey=pos.z, ez=pos.y;
  const pc=Math.max(-65,Math.min(65,pitch));
  if(mode3D){
    // IPD offset in world units (~63mm real = ~630um at chip scale feels good)
    const IPD=400;
    const yr=yaw*Math.PI/180;
    // Perpendicular to forward direction (right vector)
    const rx= Math.cos(yr), rz=-Math.sin(yr);
    renderEye(ex-rx*IPD/2, ey, ez-rz*IPD/2, yaw, pc, 0,   W/2, H);
    renderEye(ex+rx*IPD/2, ey, ez+rz*IPD/2, yaw, pc, W/2, W/2, H);
  } else {
    renderEye(ex, ey, ez, yaw, pc, 0, W, H);
  }
  updateHUD();
}

// ── MINIMAP ───────────────────────────────────────────
const mm=document.getElementById('minimap'), mx=mm.getContext('2d');
function drawMinimap(){
  const W=72,H=72,M=3;
  mx.clearRect(0,0,W,H);
  mx.fillStyle='#000a04'; mx.fillRect(0,0,W,H);
  function mapX(wx){return M+(wx-CMIN)/(CMAX-CMIN)*(W-2*M);}
  function mapY(wy){return M+(wy-CMIN)/(CMAX-CMIN)*(H-2*M);}
  // C-chip outline
  mx.strokeStyle='#0a4'; mx.lineWidth=1;
  mx.strokeRect(M,M,W-2*M,H-2*M);
  // Q-chip
  mx.fillStyle='rgba(0,80,40,0.35)';
  mx.fillRect(mapX(QMIN),mapY(QMIN),mapX(QMAX)-mapX(QMIN),mapY(QMAX)-mapY(QMIN));
  mx.strokeStyle='#0f8'; mx.lineWidth=0.8;
  mx.strokeRect(mapX(QMIN),mapY(QMIN),mapX(QMAX)-mapX(QMIN),mapY(QMAX)-mapY(QMIN));
  // Direction arrow + dot
  const px=mapX(pos.x), py=mapY(pos.y);
  const yr=yaw*Math.PI/180;
  mx.strokeStyle='#ff0'; mx.lineWidth=1.5;
  mx.beginPath(); mx.moveTo(px,py);
  mx.lineTo(px-Math.sin(yr)*6, py-Math.cos(yr)*6);
  mx.stroke();
  mx.beginPath(); mx.arc(px,py,2.5,0,Math.PI*2);
  mx.fillStyle='#ff0'; mx.fill();
}
function updateHUD(){
  document.getElementById('dpos').textContent=`${(pos.x-CCX).toFixed(0)}, ${(pos.y-CCY).toFixed(0)} µm`;
  document.getElementById('dhdg').textContent=`HDG ${((yaw%360+360)%360).toFixed(0)}°`;
  document.getElementById('dspd').textContent=`${spd} µm/s`;
  drawMinimap();
}

// ── PHYSICS ───────────────────────────────────────────
// Player is LOCKED to GAP/2 altitude — no vertical movement
// Pitch only affects camera look direction, not position
const PRAD=4;
let lastT=null;
function fly(ts){
  const dt=lastT?Math.min((ts-lastT)/1000,0.05):0.016; lastT=ts;
  if(!frozen && !paused){
    const yr=yaw*Math.PI/180;
    // Move only horizontally — no vertical movement from pitch
    let nx=pos.x+(-Math.sin(yr))*spd*dt;
    let ny=pos.y+(-Math.cos(yr))*spd*dt;
    let nz=GAP*0.5; // always locked to midpoint
    let hit=false;
    if(nx<CMIN+PRAD){nx=CMIN+PRAD+30;hit=true;}
    if(nx>CMAX-PRAD){nx=CMAX-PRAD-30;hit=true;}
    if(ny<CMIN+PRAD){ny=CMIN+PRAD+30;hit=true;}
    if(ny>CMAX-PRAD){ny=CMAX-PRAD-30;hit=true;}
    if(data){
      for(const [bx,by] of data.bumps){
        const d=Math.hypot(nx-bx,ny-by);
        if(d<BRAD+PRAD){
          const a=Math.atan2(ny-by,nx-bx);
          nx=bx+(BRAD+PRAD+30)*Math.cos(a);
          ny=by+(BRAD+PRAD+30)*Math.sin(a);
          hit=true;break;
        }
      }
    }
    pos.x=nx;pos.y=ny;pos.z=nz;
    if(hit)doHit();
  }
  if(!paused) updateParticles(dt*1000);
  render();
  requestAnimationFrame(fly);
}
function doHit(){
  if(inHit)return;inHit=true;
  const f=document.getElementById('hit');
  f.style.display='block';
  if(navigator.vibrate)navigator.vibrate(60);
  setTimeout(()=>{f.style.display='none';inHit=false;},150);
}

const keys={};
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',  e=>keys[e.key]=false);
setInterval(()=>{
  if(keys['ArrowLeft'] ||keys['a']) yaw-=1.5;

// Touch: horizontal swipe = yaw, vertical swipe = pitch
let tx0=null, ty0=null;
window.addEventListener('touchstart',e=>{
  if(e.target.closest('.btn')||e.target.closest('#spd')||e.target.closest('#dashboard'))return;
  tx0=e.touches[0].clientX; ty0=e.touches[0].clientY;
},{passive:true});
window.addEventListener('touchmove',e=>{
  if(tx0===null)return;
  const dx=e.touches[0].clientX-tx0;
  const dy=e.touches[0].clientY-ty0;
  yaw   += dx*0.15;
  pitch  = Math.max(-70,Math.min(70, pitch - dy*0.15)); // drag up = pitch up
  tx0=e.touches[0].clientX; ty0=e.touches[0].clientY;
},{passive:true});
window.addEventListener('touchend',()=>{tx0=null;ty0=null;});

// ── GYRO ──────────────────────────────────────────────
// Phone in LANDSCAPE:
// VERTICAL axis (short side of screen, floor-to-ceiling):
//   Rotating around this = beta changes = RUDDER/YAW
//   Rate-based: tilt top toward you → turn right
// HORIZONTAL axis (long side of screen, left-to-right):
//   Tilting around this = gamma changes = PITCH VIEW ONLY (±45° max)
//   Does NOT affect movement direction

let gyroCalibrated=false, calBeta=90, calGamma=0, fBeta=90, fGamma=0;
const SMOOTH=0.10;
let oriCount=0;

window.addEventListener('deviceorientation', e=>{
  oriCount++;
  if(!gyroOn)
    document.getElementById('gdbg').textContent=
      `#${oriCount} β:${(e.beta??0).toFixed(0)} γ:${(e.gamma??0).toFixed(0)}`;
},{passive:true});

function toggleGyro(){
  if(typeof DeviceOrientationEvent!=='undefined'&&
     typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(s=>{
      if(s==='granted'){
        gyroOn=true; gyroCalibrated=false;
        window.addEventListener('deviceorientation',onOri,{passive:true});
        document.getElementById('bgy').classList.add('on');
        document.getElementById('bgy').textContent='✈ GYRO ON';
      }
    });
  } else {
    gyroOn=!gyroOn; gyroCalibrated=false;
    if(gyroOn) window.addEventListener('deviceorientation',onOri,{passive:true});
    else{ window.removeEventListener('deviceorientation',onOri); pitch=0; }
    document.getElementById('bgy').classList.toggle('on',gyroOn);
    document.getElementById('bgy').textContent=gyroOn?'✈ GYRO ON':'✈ GYRO';
  }
}

function onOri(e){
  if(!gyroOn) return;
  const a=e.alpha??0, b=e.beta??0, g=e.gamma??0;
  if(!gyroCalibrated){
    calBeta=a; calGamma=g; fBeta=a; fGamma=g;
    gyroCalibrated=true; return;
  }
  // Smooth alpha (wrap-safe)
  let da=a-fBeta; if(da>180)da-=360; if(da<-180)da+=360;
  fBeta += SMOOTH*da;
  fGamma += SMOOTH*(g-fGamma);

  const rAlpha = fBeta-calBeta;   // Z-axis rotation = tilt left/right = YAW
  const rGamma = fGamma-calGamma; // X-axis rotation = pitch forward/back = PITCH

  document.getElementById('gdbg').textContent=
    `α:${a.toFixed(0)} β:${b.toFixed(0)} γ:${g.toFixed(0)}\nΔα(yaw):${rAlpha.toFixed(0)} Δγ(pitch):${rGamma.toFixed(0)}`;

  // YAW: phone tilt angle → turn rate (like a joystick, not a wheel)
  // Phone level (rAlpha near 0) → rate = 0 → fly straight
  // Phone tilted right 10° → steady rightward turn at fixed rate
  // Phone tilted right 20° → faster rightward turn
  // No accumulation — rate comes purely from current tilt
  const dead=3;
  const tilt = Math.abs(rAlpha)>dead ? (rAlpha - Math.sign(rAlpha)*dead) : 0;
  yaw += tilt * 0.15; // 10° tilt = 1.5°/event turn rate

  // PITCH: gamma = X-axis. Tilt nose down → look down. Phone up = look up.
  // rGamma positive = tilted forward/down → negative pitch (look down)
  // rGamma negative = tilted back/up → positive pitch (look up)
  pitch = Math.max(-35, Math.min(35, rGamma*1.2));
}

// ── CONTROLS ──────────────────────────────────────────
function togglePause(){
  paused=!paused;
  const btn=document.getElementById('bpause');
  btn.textContent=paused?'▶ RESUME':'⏸ PAUSE';
  btn.classList.toggle('on',paused);
}
function resetPos(){
  pos={...START};yaw=START_YAW;pitch=0;
  frozen=true; gyroCalibrated=false;
  setTimeout(()=>frozen=false, 1500);
}
function toggleFS(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
    document.getElementById('bfs').textContent='✕ EXIT FULL';
  } else { document.exitFullscreen(); }
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement)document.getElementById('bfs').textContent='⛶ FULLSCREEN';
});
function toggle3D(){
  mode3D=!mode3D;
  document.getElementById('b3d').classList.toggle('on',mode3D);
  document.getElementById('vsep').style.display=mode3D?'block':'none';
}
function chSpd(d){
  sIdx=Math.max(0,Math.min(SPEEDS.length-1,sIdx+d));
  spd=SPEEDS[sIdx];
  document.getElementById('dspd').textContent=`${spd} µm/s`;
}
window.addEventListener('resize',()=>{cv.width=window.innerWidth;cv.height=window.innerHeight;});

// ── LOAD ──────────────────────────────────────────────
function lp(p,m){document.getElementById('pfill').style.width=p+'%';
  document.getElementById('lstatus').textContent=m;}
async function init(){
  lp(5,'Fetching geometry…');
  let r;
  try {
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),15000);
    r=await fetch('chip_data.json?v=11',{signal:ctrl.signal});
    clearTimeout(tid);
    if(!r.ok) throw new Error(`HTTP ${r.status} — chip_data.json not found. Upload it to GitHub!`);
  } catch(e){
    lp(0,'❌ '+e.message);
    document.getElementById('lstatus').style.color='#f44';
    return;
  }
  lp(30,'Parsing…');
  data=await r.json();
  lp(55,'GPU: layers…');
  bL130=flatBuf(data.layer130.verts,data.layer130.indices);
  lp(63,'GPU: L2…');
  bL2  =flatBuf(data.layer2.verts,  data.layer2.indices);
  lp(70,'GPU: L3…');
  bL3  =flatBuf(data.layer3.verts,  data.layer3.indices);
  lp(78,'Building bumps…');
  bBumps  =mkBumps(data.bumps);
  lp(90,'Building scene…');
  bSiFloor=mkSiFloor();
  bSiCeil =mkSiCeil();
  bQBox   =mkQBox();
  initParticles();
  lp(100,'Ready — hold phone level…');
  setTimeout(()=>{
    document.getElementById('loading').style.display='none';
    setTimeout(()=>{ frozen=false; },1500);
    requestAnimationFrame(fly);
  },250);
}
init().catch(e=>{document.getElementById('lstatus').textContent='Error: '+e.message;console.error(e);});
</script>
